<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes pulse-red {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .update-dot {
      width: 8px; height: 8px; background: #ef4444; border-radius: 50%;
      position: absolute; top: -2px; right: -2px;
      animation: pulse-red 2s infinite;
    }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent; bottom: 0; color: transparent; cursor: pointer;
      height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center font-sans h-[100dvh] overflow-hidden relative">

  <!-- ================= 密碼鎖畫面 ================= -->
  <div id="lock-screen" class="fixed inset-0 bg-gray-900/95 z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-11/12 max-w-sm text-center transform transition-transform">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-lock text-2xl"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">需要解鎖</h2>
      <p class="text-sm text-gray-500 mb-6">請輸入密碼以存取您的記帳資料</p>
      
      <input type="password" id="lock-password" inputmode="numeric" pattern="[0-9]*" class="w-full text-center text-3xl tracking-[0.5em] p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors mb-2" placeholder="••••">
      <p id="lock-error" class="text-red-500 text-sm mb-4 h-5 opacity-0 transition-opacity">密碼錯誤，請重試</p>
      
      <button onclick="checkPassword()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
        解鎖進入
      </button>
    </div>
  </div>

  <!-- 分類管理彈出視窗 (Modal) -->
  <div id="category-modal" class="fixed inset-0 bg-gray-900/80 z-[110] flex flex-col items-center justify-end md:justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-[400px] p-6 pb-10 shadow-2xl transform transition-transform translate-y-full md:translate-y-0 h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h3 id="cat-modal-title" class="text-lg font-bold text-gray-800">新增分類</h3>
        <button onclick="closeCategoryModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-1">
        <input type="hidden" id="cat-id-input">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">分類類型</label>
          <select id="cat-type-input" class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">分類名稱</label>
          <input type="text" id="cat-name-input" placeholder="例如：寵物、醫療..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇圖示</label>
          <div id="cat-icon-picker" class="grid grid-cols-6 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇顏色</label>
          <div id="cat-color-picker" class="grid grid-cols-5 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">自動歸類關鍵字 (以逗號分隔)</label>
          <textarea id="cat-keywords-input" rows="3" placeholder="例如：動物醫院,寵物公園,肉泥..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100 flex space-x-3 shrink-0">
         <button id="cat-delete-btn" onclick="deleteCurrentCategory()" class="hidden px-4 py-3 bg-red-50 text-red-600 font-bold rounded-xl active:scale-95 transition-all"><i class="fas fa-trash"></i></button>
         <button onclick="saveCategory()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
           儲存分類
         </button>
      </div>
    </div>
  </div>

  <!-- 資產管理彈出視窗 (Modal) -->
  <div id="asset-modal" class="fixed inset-0 bg-gray-900/80 z-[120] flex flex-col items-center justify-end md:justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-[400px] p-6 pb-10 shadow-2xl transform transition-transform translate-y-full md:translate-y-0 h-auto flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 id="asset-modal-title" class="text-lg font-bold text-gray-800">新增資產</h3>
        <button onclick="closeAssetModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="space-y-4">
        <input type="hidden" id="asset-id-input">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">資產名稱</label>
          <input type="text" id="asset-name-input" placeholder="例如：台新銀行、台股戶頭..." class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">資產類別</label>
          <select id="asset-type-input" class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
            <option value="cash">現金</option>
            <option value="deposit">存款</option>
            <option value="investment">投資</option>
            <option value="stock">股票庫存</option>
            <option value="credit">信用貸款</option>
            <option value="mortgage">房屋貸款</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">當前金額 (可自由設定異動)</label>
          <input type="number" id="asset-balance-input" inputmode="numeric" class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500" placeholder="0">
        </div>
      </div>

      <div class="mt-6 flex space-x-3">
         <button id="asset-delete-btn" onclick="deleteAsset()" class="hidden px-4 py-3 bg-red-50 text-red-600 font-bold rounded-xl active:scale-95 transition-all"><i class="fas fa-trash"></i></button>
         <button onclick="saveAsset()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
           儲存資產
         </button>
      </div>
    </div>
  </div>

  <!-- APP 容器框架 -->
  <div class="w-full max-w-[400px] h-full md:h-[800px] bg-gray-50 md:rounded-[3rem] md:shadow-2xl relative overflow-hidden flex flex-col md:border-[8px] border-gray-900">
    
    <!-- 頂部 Header -->
    <header class="bg-white px-4 pt-10 pb-3 shadow-sm z-10 flex justify-between items-center shrink-0 h-16">
      <div class="text-base font-bold text-gray-800 tracking-wide">極簡記帳</div>
      <div class="relative">
        <button id="btn-cloud-sync" onclick="handleCloudButtonClick()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-gray-100 text-gray-500 text-xs font-bold shadow-sm transition-all active:scale-95 border border-gray-200">
          <i id="cloud-icon" class="fas fa-cloud"></i>
          <span id="cloud-sync-text">未連線</span>
        </button>
        <div id="cloud-update-dot" class="update-dot hidden"></div>
      </div>
    </header>

    <!-- 提示框 -->
    <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm flex items-center opacity-0 pointer-events-none transition-opacity duration-300">
      <i class="fas fa-check-circle text-green-400 mr-2"></i><span id="toast-msg">操作成功</span>
    </div>

    <!-- 主要視圖區塊 (View Container) -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
      
      <!-- ===================================================================== -->
      <!--                         [頁面一] 記帳 (Add)                          -->
      <!-- ===================================================================== -->
      <div id="view-add" class="p-3 flex-1 flex flex-col">
        
        <!-- 頂部切換: 支出 / 收入 / 移轉 -->
        <div class="flex bg-gray-200 p-1 rounded-xl mb-3 shrink-0">
          <button id="btn-type-expense" onclick="setTxType('expense')" class="flex-1 py-1.5 text-sm font-bold bg-white shadow-sm rounded-lg text-gray-800 transition-colors">支出</button>
          <button id="btn-type-income" onclick="setTxType('income')" class="flex-1 py-1.5 text-sm font-bold text-gray-500 rounded-lg transition-colors">收入</button>
          <button id="btn-type-transfer" onclick="setTxType('transfer')" class="flex-1 py-1.5 text-sm font-bold text-gray-500 rounded-lg transition-colors">移轉</button>
        </div>

        <!-- 選擇分類 (移轉模式時隱藏) -->
        <div id="category-section" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-3 shrink-0">
          <label class="block text-xs font-medium text-gray-700 mb-2">選擇分類</label>
          <div id="category-container" class="grid grid-cols-4 gap-2">
            <!-- JS 動態生成按鈕 -->
          </div>
        </div>
        
        <!-- 表單細節區塊 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-4 flex-1 overflow-y-auto no-scrollbar">
          
          <!-- 日期 -->
          <div class="w-full">
            <label class="block text-xs font-medium text-gray-700 mb-1">日期</label>
            <input type="date" id="input-date" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block">
          </div>

          <!-- 資產選擇 (支出/收入 模式) -->
          <div id="asset-single-section" class="w-full">
            <label class="block text-xs font-medium text-gray-700 mb-1">資產帳戶</label>
            <select id="input-asset" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
          </div>

          <!-- 移轉資產選擇 (移轉 模式) -->
          <div id="asset-transfer-section" class="w-full hidden space-y-3">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">移出資產 (扣除)</label>
              <select id="input-asset-from" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">轉入資產 (增加)</label>
              <select id="input-asset-to" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
            </div>
          </div>

          <!-- 消費金額 -->
          <div class="p-3 bg-blue-50/40 rounded-xl border border-blue-100 border-l-4 border-l-blue-500 relative w-full box-border">
            <label class="block text-xs font-medium text-blue-600 mb-1">金額</label>
            <div class="flex items-center text-3xl font-bold text-gray-800">
              <span class="mr-2 text-gray-400">$</span>
              <input type="number" id="input-amount" inputmode="numeric" pattern="[0-9]*" placeholder="0" class="w-full bg-transparent border-none outline-none focus:ring-0 p-0 tracking-tight block box-border">
            </div>
          </div>

          <!-- 備註 -->
          <div class="w-full pb-2">
            <label class="block text-xs font-medium text-gray-700 mb-1">備註 (選填)</label>
            <input type="text" id="input-note" placeholder="例如：晚餐、跨行轉帳..." class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block">
          </div>
        </div>

        <button onclick="addRecord()" class="w-full mt-3 py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-xl shadow-md shadow-blue-200 transition-all active:scale-[0.98] shrink-0">
          儲存紀錄
        </button>
      </div>

      <!-- ===================================================================== -->
      <!--                         [頁面二] 統計 (Stats)                        -->
      <!-- ===================================================================== -->
      <div id="view-stats" class="p-3 space-y-3 hidden" style="touch-action: pan-y;">
        
        <!-- 篩選列 -->
        <div class="flex space-x-2">
          <select id="filter-year" onchange="updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center"></select>
          <select id="filter-month" onchange="updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center">
            <option value="all">全年</option>
            <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
            <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
            <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
          </select>
        </div>

        <!-- 統計類型切換 -->
        <div class="flex bg-gray-200 p-1 rounded-lg">
           <button id="stats-type-expense" onclick="setStatsType('expense')" class="flex-1 py-1 text-xs font-bold bg-white shadow-sm rounded text-gray-800 transition-colors">支出分析</button>
           <button id="stats-type-income" onclick="setStatsType('income')" class="flex-1 py-1 text-xs font-bold text-gray-500 rounded transition-colors">收入分析</button>
        </div>
        
        <!-- 搜尋列 -->
        <div class="flex space-x-2">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="input-search" placeholder="搜尋備註與分類..." oninput="handleSearch()" class="w-full pl-9 p-2.5 text-sm font-medium bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors shadow-sm">
          </div>
          <button id="btn-clear-filter" onclick="clearCategoryFilter()" class="hidden px-3 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold hover:bg-gray-200 transition-colors shadow-sm whitespace-nowrap active:scale-95">清除篩選</button>
        </div>

        <!-- 總計顯示 -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-4 text-white shadow-md relative overflow-hidden">
          <h3 id="stats-title-text" class="text-blue-100 text-xs font-medium mb-1 transition-all duration-300 transform origin-left">本月總額</h3>
          <div id="total-expense" class="text-3xl font-bold tracking-tight">$0</div>
        </div>

        <!-- 圓餅圖與明細 -->
        <div id="stats-card" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
          <h3 class="w-full text-left text-sm font-bold text-gray-800 mb-2">結構佔比 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊圖表可篩選)</span></h3>
          <div class="relative flex items-center justify-center h-32 w-32">
            <canvas id="pieChart" width="128" height="128" class="cursor-pointer transition-transform hover:scale-105"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
               <span class="text-gray-400 text-[10px]">Total</span>
            </div>
          </div>
          <div id="stats-breakdown" class="w-full mt-4 space-y-1"></div>
        </div>

        <!-- 紀錄清單 -->
        <div>
          <h3 id="history-list-title" class="text-sm font-bold text-gray-800 mb-2 px-1">區間紀錄 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊文字可直接修改)</span></h3>
          <div id="history-list" class="space-y-2 pb-4"></div>
        </div>
      </div>

      <!-- ===================================================================== -->
      <!--                         [頁面三] 資產 (Assets)                       -->
      <!-- ===================================================================== -->
      <div id="view-assets" class="p-3 space-y-4 hidden h-full overflow-y-auto no-scrollbar">
         <!-- Header & Net Worth -->
         <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 text-white shadow-md relative mt-1">
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-blue-100 text-sm font-medium">總淨資產</h3>
              <button onclick="openAssetModal()" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-bold transition-colors shadow-sm active:scale-95">
                <i class="fas fa-plus mr-1"></i> 新增資產
              </button>
            </div>
            <div id="total-net-worth" class="text-4xl font-bold tracking-tight">$0</div>
         </div>

         <!-- Assets List -->
         <div id="assets-list" class="space-y-3 pb-6"></div>
      </div>

      <!-- ===================================================================== -->
      <!--                         [頁面四] 設定 (Settings)                       -->
      <!-- ===================================================================== -->
      <div id="view-settings" class="p-3 space-y-3 hidden">

        <!-- 分類管理區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-center">
            <div>
              <h2 class="text-lg font-bold text-gray-800">分類與發票關鍵字</h2>
              <p class="text-xs text-gray-500 mt-1">管理分類並設定發票自動歸類規則。</p>
            </div>
            <button onclick="openCategoryModal()" class="shrink-0 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">
              <i class="fas fa-plus"></i> 新增
            </button>
          </div>
          <div class="p-4">
            <div id="settings-category-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div>
          </div>
        </div>
        
        <!-- 雲端發票整合區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50">
            <h2 class="text-lg font-bold text-gray-800">雲端發票整合</h2>
            <p class="text-xs text-gray-500 mt-1">請至財政部電子發票平台下載「發票明細表(CSV)」並在此匯入，系統會自動歸類與過濾重複資料。</p>
          </div>
          <div class="p-4">
            <div class="relative">
              <input type="file" id="import-invoice-file" accept=".csv" onchange="importInvoiceCSV(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <button class="w-full flex items-center justify-center py-2.5 bg-orange-50 text-orange-600 rounded-lg text-sm font-bold shadow-sm pointer-events-none transition-all hover:bg-orange-100">
                <i class="fas fa-file-invoice mr-2"></i> 匯入財政部發票 CSV
              </button>
            </div>
          </div>
        </div>

        <!-- 備份區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-start">
            <div>
              <h2 class="text-lg font-bold text-gray-800">資料備份與還原</h2>
              <p class="text-xs text-gray-500 mt-1">連線後，跨裝置時系統會自動偵測並「合併」本地與雲端的紀錄。</p>
              <p id="sync-status-label" class="text-[10px] text-gray-400 mt-1 italic">尚未連線同步</p>
            </div>
            <button onclick="connectDrive()" class="ml-2 shrink-0 px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold hover:bg-gray-200 transition-colors shadow-sm">切換帳號</button>
          </div>
          <div class="p-4 space-y-3">
            <button onclick="syncFromDriveManual()" class="w-full flex items-center justify-center py-2.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fas fa-sync mr-2"></i> 從雲端下載並合併資料</button>
            <button onclick="executeDriveUpload(false)" class="w-full flex items-center justify-center py-2.5 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fab fa-google-drive mr-2"></i> 手動強制同步(上傳)至雲端</button>
            <button onclick="exportData()" class="w-full flex items-center justify-center py-2.5 bg-gray-50 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium"><i class="fas fa-download mr-2"></i> 直接下載備份檔 (JSON)</button>
            <div class="relative">
              <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <button class="w-full flex items-center justify-center py-2.5 bg-gray-50 text-gray-600 rounded-lg text-sm font-medium border border-gray-200 pointer-events-none transition-all"><i class="fas fa-upload mr-2"></i> 從 JSON 檔案還原</button>
            </div>
          </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm border border-red-100 overflow-hidden mt-4">
           <div class="p-4">
             <button onclick="clearAllData()" class="w-full flex items-center justify-center py-2.5 bg-red-50 text-red-600 rounded-lg text-sm font-medium"><i class="fas fa-trash-alt mr-2"></i> 清空所有資料</button>
           </div>
        </div>
      </div>

    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-gray-100 px-2 pt-2 pb-6 md:pb-2 flex justify-around items-center z-10 w-full shrink-0">
      <button onclick="switchTab('stats')" id="nav-stats" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-chart-pie text-xl"></i><span class="text-[10px] font-medium">統計</span></button>
      <button onclick="switchTab('add')" id="nav-add" class="flex-1 flex flex-col items-center space-y-1 text-blue-600 transition-colors"><i class="fas fa-plus-circle text-2xl"></i><span class="text-[10px] font-medium">記帳</span></button>
      <button onclick="switchTab('assets')" id="nav-assets" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-wallet text-xl"></i><span class="text-[10px] font-medium">資產</span></button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-cog text-xl"></i><span class="text-[10px] font-medium">設定</span></button>
    </nav>
  </div>

  <!-- JavaScript 邏輯模組 -->
  <script>
    // ==========================================
    // 🔒 密碼鎖設定
    // ==========================================
    const TARGET_HASH = 1625059299;
    function generateHash(str) {
      return str.split('').reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0);
    }
    function checkPassword() {
      const input = document.getElementById('lock-password').value;
      if (generateHash(input) === TARGET_HASH) {
        sessionStorage.setItem('app_unlocked', 'true');
        const lockScreen = document.getElementById('lock-screen');
        lockScreen.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => { lockScreen.style.display = 'none'; }, 300);
      } else {
        const errorMsg = document.getElementById('lock-error');
        errorMsg.classList.remove('opacity-0');
        document.getElementById('lock-password').value = '';
        setTimeout(() => { errorMsg.classList.add('opacity-0'); }, 2000);
      }
    }
    document.getElementById('lock-password').addEventListener('keypress', function (e) { if (e.key === 'Enter') checkPassword(); });

    // ==========================================
    // ⚠️ 基礎定義與初始化
    // ==========================================
    const GOOGLE_CLIENT_ID = '939340478771-4bupp9mrpr55j1j4domrb4g6pehm86j5.apps.googleusercontent.com'; 
    let tokenClient, backgroundCheckInterval = null, cloudHasUpdate = false;

    const ASSET_TYPES = {
      cash: { name: '現金', icon: 'fas fa-wallet', color: '#10B981', sign: 1 },
      deposit: { name: '存款', icon: 'fas fa-piggy-bank', color: '#3B82F6', sign: 1 },
      investment: { name: '投資', icon: 'fas fa-chart-line', color: '#8B5CF6', sign: 1 },
      stock: { name: '股票庫存', icon: 'fas fa-chart-bar', color: '#F59E0B', sign: 1 },
      credit: { name: '信用貸款', icon: 'fas fa-credit-card', color: '#EF4444', sign: -1 },
      mortgage: { name: '房屋貸款', icon: 'fas fa-house-damage', color: '#EC4899', sign: -1 }
    };

    const DEFAULT_CATEGORIES = [
      { id: 'food', name: '餐飲', icon: 'fas fa-utensils', color: '#F59E0B', type: 'expense', keywords: [] },
      { id: 'clothes', name: '服飾', icon: 'fas fa-tshirt', color: '#EC4899', type: 'expense', keywords: [] },
      { id: 'housing', name: '居住', icon: 'fas fa-home', color: '#8B5CF6', type: 'expense', keywords: [] },
      { id: 'transport', name: '交通', icon: 'fas fa-car', color: '#3B82F6', type: 'expense', keywords: [] },
      { id: 'education', name: '學習', icon: 'fas fa-book', color: '#10B981', type: 'expense', keywords: [] },
      { id: 'entertainment', name: '娛樂', icon: 'fas fa-gamepad', color: '#EF4444', type: 'expense', keywords: [] },
      { id: 'other', name: '其他', icon: 'fas fa-ellipsis-h', color: '#6B7280', type: 'expense', keywords: [] },
      { id: 'salary', name: '薪資', icon: 'fas fa-hand-holding-usd', color: '#10B981', type: 'income', keywords: ['薪水', '獎金'] },
      { id: 'income_other', name: '其他收入', icon: 'fas fa-coins', color: '#F59E0B', type: 'income', keywords: [] }
    ];

    let categories = [], records = [], assets = [];
    let selectedCategoryId = null, currentTab = 'add';
    let currentTxType = 'expense'; // 'expense', 'income', 'transfer'
    let currentStatsType = 'expense'; // 'expense', 'income'
    let currentSearchQuery = '', currentCategoryFilter = null, pieChartSlices = [];

    function init() {
      if (sessionStorage.getItem('app_unlocked') === 'true') document.getElementById('lock-screen').style.display = 'none';
      else setTimeout(() => { const lockInput = document.getElementById('lock-password'); if (lockInput) lockInput.focus(); }, 100);

      try { const sc = localStorage.getItem('my_categories'); categories = sc ? JSON.parse(sc) : [...DEFAULT_CATEGORIES]; } catch(e){ categories = [...DEFAULT_CATEGORIES]; }
      categories.forEach(c => { if(!c.type) c.type = 'expense'; });
      if(!categories.some(c => c.type === 'income')) categories.push(...DEFAULT_CATEGORIES.filter(c => c.type === 'income'));

      try { const sa = localStorage.getItem('my_assets'); assets = sa ? JSON.parse(sa) : [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; } catch(e){ assets = [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; }
      if(assets.length === 0) assets.push({ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 });

      try { const sr = localStorage.getItem('my_expenses'); records = sr ? JSON.parse(sr) : []; } catch(e){ records = []; }
      records.forEach(r => {
         if(!r.type) r.type = (r.cat === 'transfer') ? 'transfer' : 'expense';
         if(!r.assetId && r.type !== 'transfer') r.assetId = assets[0].id;
      });

      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      
      renderAssetSelects();
      setTxType('expense');
      initDateFilters(true);
      checkTokenStatus();

      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkTokenStatus(); else stopBackgroundCheck(); });
      window.addEventListener('focus', () => { const token = localStorage.getItem('gdrive_token'); if (token) checkCloudUpdate(token); });
      initCanvasClickListener();
      initSwipeGestures();
    }

    // ==========================================
    // 💼 資產與紀錄邏輯 (Assets & Records)
    // ==========================================
    window.renderAssetSelects = () => {
        const options = assets.map(a => `<option value="${a.id}">${a.name} ($${a.balance.toLocaleString()})</option>`).join('');
        document.getElementById('input-asset').innerHTML = options;
        document.getElementById('input-asset-from').innerHTML = options;
        document.getElementById('input-asset-to').innerHTML = options;
    };

    window.renderAssetsView = () => {
       let netWorth = 0;
       assets.forEach(a => { const sign = ASSET_TYPES[a.type]?.sign || 1; netWorth += a.balance * sign; });
       document.getElementById('total-net-worth').innerText = `$${netWorth.toLocaleString()}`;

       const list = document.getElementById('assets-list');
       if(assets.length === 0) { list.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">尚無資產項目</div>'; return; }

       list.innerHTML = assets.map(a => {
           const typeInfo = ASSET_TYPES[a.type] || ASSET_TYPES['cash'];
           return `
             <div onclick="openAssetModal('${a.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer hover:border-blue-200 transition-colors">
                <div class="flex items-center space-x-4">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background-color: ${typeInfo.color}"><i class="${typeInfo.icon} text-lg"></i></div>
                  <div><div class="font-bold text-gray-800 text-sm">${a.name}</div><div class="text-[10px] text-gray-400">${typeInfo.name}</div></div>
                </div>
                <div class="text-right font-bold text-lg text-gray-800">$${a.balance.toLocaleString()}</div>
             </div>`;
       }).join('');
    };

    window.setTxType = (type) => {
      currentTxType = type;
      ['expense', 'income', 'transfer'].forEach(t => {
         const btn = document.getElementById(`btn-type-${t}`);
         if(t === type) btn.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg transition-colors bg-white shadow-sm text-gray-800';
         else btn.className = 'flex-1 py-1.5 text-sm font-bold rounded-lg transition-colors text-gray-500';
      });

      if (type === 'transfer') {
         document.getElementById('category-section').classList.add('hidden');
         document.getElementById('asset-single-section').classList.add('hidden');
         document.getElementById('asset-transfer-section').classList.remove('hidden');
      } else {
         document.getElementById('category-section').classList.remove('hidden');
         document.getElementById('asset-single-section').classList.remove('hidden');
         document.getElementById('asset-transfer-section').classList.add('hidden');
         renderCategories(); 
      }
    };

    window.renderCategories = () => {
        const container = document.getElementById('category-container'); if(!container) return;
        const filteredCats = categories.filter(c => c.type === currentTxType);
        container.innerHTML = filteredCats.map(cat => `
          <button onclick="selectCategory('${cat.id}')" class="cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-gray-50 border-transparent" data-id="${cat.id}">
            <div class="icon-wrap w-8 h-8 flex items-center justify-center rounded-full mb-1 transition-colors" style="background-color: #E5E7EB; color: #6B7280"><i class="${cat.icon} text-sm"></i></div><span class="text-[10px] transition-colors text-gray-600 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">${cat.name}</span>
          </button>`).join('');
          
        if(!filteredCats.find(c => c.id === selectedCategoryId)) selectedCategoryId = filteredCats[0]?.id;
        if(selectedCategoryId) window.selectCategory(selectedCategoryId);
    };

    window.selectCategory = (id) => {
      selectedCategoryId = id;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const cat = categories.find(c => c.id === btn.dataset.id); if(!cat) return;
        const iw = btn.querySelector('.icon-wrap'), ts = btn.querySelector('span');
        if(cat.id === id) {
          btn.className = `cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-blue-50 border-blue-500`;
          iw.style.cssText = `background-color: ${cat.color}; color: white`; ts.className = `text-[10px] transition-colors font-bold text-blue-700 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center`;
        } else {
          btn.className = `cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-gray-50 border-transparent hover:bg-gray-100`;
          iw.style.cssText = `background-color: #E5E7EB; color: #6B7280`; ts.className = `text-[10px] transition-colors text-gray-600 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center`;
        }
      });
    };

    window.addRecord = () => {
      const amount = Number(document.getElementById('input-amount').value);
      if(!amount || amount <= 0) return showToast('請輸入有效的金額！');

      const record = { id: Date.now().toString(), type: currentTxType, amount, date: document.getElementById('input-date').value, note: document.getElementById('input-note').value.trim() };

      if (currentTxType === 'expense' || currentTxType === 'income') {
         record.cat = selectedCategoryId;
         record.assetId = document.getElementById('input-asset').value;
         const a = assets.find(x => x.id === record.assetId);
         if(a) a.balance += (currentTxType === 'income' ? amount : -amount);
      } else if (currentTxType === 'transfer') {
         record.assetFrom = document.getElementById('input-asset-from').value;
         record.assetTo = document.getElementById('input-asset-to').value;
         if (record.assetFrom === record.assetTo) return showToast('轉出與轉入資產不可相同');
         const aF = assets.find(x => x.id === record.assetFrom);
         const aT = assets.find(x => x.id === record.assetTo);
         if(aF) aF.balance -= amount;
         if(aT) aT.balance += amount;
      }

      records.push(record);
      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      localStorage.setItem('my_expenses', JSON.stringify(records));
      localStorage.setItem('my_assets', JSON.stringify(assets));
      
      document.getElementById('input-amount').value = '';
      document.getElementById('input-note').value = '';
      
      initDateFilters(); 
      renderAssetSelects();
      if(currentTab === 'assets') renderAssetsView();
      showToast('✅ 記帳成功！');
      executeDriveUpload(true);
    };

    window.updateRecordField = (id, field, value) => {
      const index = records.findIndex(r => r.id === id); if (index === -1) return;
      const r = records[index];

      if (field === 'amount') {
          value = Number(value);
          if (!value || value <= 0) { showToast('無效金額'); updateStatsView(); return; }
          const diff = value - r.amount;
          if (r.type === 'expense') { const a = assets.find(x => x.id === r.assetId); if (a) a.balance -= diff; } 
          else if (r.type === 'income') { const a = assets.find(x => x.id === r.assetId); if (a) a.balance += diff; } 
          else if (r.type === 'transfer') { const aF = assets.find(x => x.id === r.assetFrom); const aT = assets.find(x => x.id === r.assetTo); if (aF) aF.balance -= diff; if (aT) aT.balance += diff; }
          localStorage.setItem('my_assets', JSON.stringify(assets));
      } else if (field === 'note') value = value.trim();

      r[field] = value;
      if (field === 'date') records.sort((a, b) => new Date(b.date) - new Date(a.date));

      localStorage.setItem('my_expenses', JSON.stringify(records));
      updateStatsView(); renderAssetSelects();
      showToast('✅ 紀錄已自動儲存');
      executeDriveUpload(true);
    };

    window.deleteRecord = (id) => {
      if(!confirm('確定要刪除這筆紀錄嗎？')) return;
      const r = records.find(x => x.id === id);
      if(r) {
         if (r.type === 'expense') { const a = assets.find(x => x.id === r.assetId); if (a) a.balance += r.amount; } 
         else if (r.type === 'income') { const a = assets.find(x => x.id === r.assetId); if (a) a.balance -= r.amount; } 
         else if (r.type === 'transfer') { const aF = assets.find(x => x.id === r.assetFrom); const aT = assets.find(x => x.id === r.assetTo); if (aF) aF.balance += r.amount; if (aT) aT.balance -= r.amount; }
         localStorage.setItem('my_assets', JSON.stringify(assets));
      }
      records = records.filter(x => x.id !== id);
      localStorage.setItem('my_expenses', JSON.stringify(records));
      initDateFilters(); updateStatsView(); renderAssetSelects();
      showToast('已刪除紀錄'); executeDriveUpload(true);
    };

    // ==========================================
    // 📊 統計與視圖 (Stats & View)
    // ==========================================
    window.switchTab = (tab) => {
      currentTab = tab;
      ['add', 'stats', 'assets', 'settings'].forEach(t => document.getElementById(`view-${t}`).classList.add('hidden'));
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.querySelectorAll('nav button').forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-gray-400'); });
      document.getElementById(`nav-${tab}`).classList.replace('text-gray-400', 'text-blue-600');
      if(tab === 'stats') updateStatsView();
      if(tab === 'assets') renderAssetsView();
      if(tab === 'settings') renderSettingsCategories();
      const token = localStorage.getItem('gdrive_token'); if (token) checkCloudUpdate(token);
    };

    window.setStatsType = (type) => {
        currentStatsType = type;
        document.getElementById('stats-type-expense').className = `flex-1 py-1 text-xs font-bold rounded transition-colors ${type === 'expense' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-500'}`;
        document.getElementById('stats-type-income').className = `flex-1 py-1 text-xs font-bold rounded transition-colors ${type === 'income' ? 'bg-white shadow-sm text-gray-800' : 'text-gray-500'}`;
        updateStatsView();
    };

    window.initDateFilters = (isFirstLoad = false) => {
      const yearSelect = document.getElementById('filter-year'), monthSelect = document.getElementById('filter-month');
      const currentSelectedYear = yearSelect.value, currentYear = new Date().getFullYear().toString();
      const years = new Set(records.map(r => r.date.split('-')[0])); years.add(currentYear);
      const sortedYears = Array.from(years).sort((a, b) => b - a);
      yearSelect.innerHTML = '<option value="all">全部年份</option>' + sortedYears.map(y => `<option value="${y}">${y}年</option>`).join('');
      if (!isFirstLoad && currentSelectedYear && sortedYears.includes(currentSelectedYear)) yearSelect.value = currentSelectedYear;
      else if (isFirstLoad || !currentSelectedYear) { yearSelect.value = currentYear; monthSelect.value = String(new Date().getMonth() + 1).padStart(2, '0'); }
    };

    window.updateStatsView = () => {
      const selectedYear = document.getElementById('filter-year').value, monthSelect = document.getElementById('filter-month'), selectedMonth = monthSelect.value;
      if (selectedYear === 'all') { monthSelect.value = 'all'; monthSelect.disabled = true; monthSelect.classList.add('opacity-50', 'bg-gray-100'); } 
      else { monthSelect.disabled = false; monthSelect.classList.remove('opacity-50', 'bg-gray-100'); }
      
      let filteredRecords = records;
      let titleText = '累積總額';
      
      if (selectedYear !== 'all') {
          if (selectedMonth !== 'all') { filteredRecords = filteredRecords.filter(r => r.date.startsWith(`${selectedYear}-${selectedMonth}`)); titleText = `${selectedYear}年 ${parseInt(selectedMonth)}月`; } 
          else { filteredRecords = filteredRecords.filter(r => r.date.startsWith(selectedYear)); titleText = `${selectedYear}年`; }
      }
      titleText += currentStatsType === 'expense' ? ' 總支出' : ' 總收入';

      if (currentSearchQuery) {
          filteredRecords = filteredRecords.filter(r => {
             const catName = categories.find(c => c.id === r.cat)?.name || '';
             return (r.note && r.note.toLowerCase().includes(currentSearchQuery)) || catName.includes(currentSearchQuery);
          });
      }

      document.getElementById('stats-title-text').innerText = titleText;
      
      // 依統計類型計算總額與圖表
      let chartRecords = filteredRecords.filter(r => r.type === currentStatsType);
      let total = 0; let totalsByCat = {};
      chartRecords.forEach(r => { total += r.amount; totalsByCat[r.cat] = (totalsByCat[r.cat] || 0) + r.amount; });
      document.getElementById('total-expense').innerText = `$${total.toLocaleString()}`;
      
      const canvas = document.getElementById('pieChart'), ctx = canvas.getContext('2d'), cx = canvas.width/2, cy = canvas.height/2, radius = Math.min(cx, cy);
      ctx.clearRect(0, 0, canvas.width, canvas.height); pieChartSlices = [];
      
      if(total === 0) {
        ctx.fillStyle = '#f3f4f6'; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
        document.getElementById('stats-breakdown').innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">無資料</div>';
      } else {
        let startAngle = -0.5 * Math.PI; let breakdownArr = [];
        categories.forEach(cat => {
          if(totalsByCat[cat.id]) {
             const amount = totalsByCat[cat.id]; const sliceAngle = (amount / total) * 2 * Math.PI; const endAngle = startAngle + sliceAngle;
             ctx.fillStyle = cat.color; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle); ctx.closePath(); ctx.fill(); 
             pieChartSlices.push({ id: cat.id, startAngle, endAngle }); startAngle = endAngle;
             breakdownArr.push({ ...cat, amount, percent: ((amount / total) * 100).toFixed(1) });
          }
        });
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, radius * 0.6, 0, Math.PI * 2); ctx.fill();
        breakdownArr.sort((a,b) => b.amount - a.amount);
        document.getElementById('stats-breakdown').innerHTML = breakdownArr.map(item => `
          <div onclick="filterByCategory('${item.id}')" class="flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-colors ${currentCategoryFilter === item.id ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50 border border-transparent'}">
             <div class="flex items-center"><div class="w-3 h-3 rounded-full mr-2" style="background-color: ${item.color}"></div><span class="text-xs ${currentCategoryFilter === item.id ? 'font-bold text-blue-700' : 'text-gray-700'}">${item.name}</span></div>
             <div class="flex items-center space-x-2"><span class="text-xs font-medium text-gray-900">$${item.amount.toLocaleString()}</span><span class="text-[10px] text-gray-400 w-8 text-right">${item.percent}%</span></div>
          </div>`).join('');
      }

      // 列表顯示過濾後的該類型紀錄，以及全部移轉
      let listRecords = filteredRecords.filter(r => r.type === currentStatsType || r.type === 'transfer');
      if (currentCategoryFilter) listRecords = listRecords.filter(r => r.cat === currentCategoryFilter);

      const listTitle = document.getElementById('history-list-title');
      if (currentSearchQuery || currentCategoryFilter) {
          let catName = currentCategoryFilter ? categories.find(c => c.id === currentCategoryFilter)?.name : '';
          listTitle.innerHTML = `篩選結果 <span class="text-blue-500 font-normal text-xs ml-1">${currentSearchQuery ? `關鍵字: "${currentSearchQuery}" ` : ''}${catName||''}</span>`;
      } else { listTitle.innerHTML = '區間紀錄 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊直接修改)</span>'; }

      const historyContainer = document.getElementById('history-list');
      if(listRecords.length === 0) { historyContainer.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm">此區間/條件下尚未有記帳紀錄</div>'; 
      } else {
         const catOptionsTemplate = categories.filter(c => c.type === currentStatsType).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
         historyContainer.innerHTML = listRecords.map(r => {
           let catIconHtml = '', catSelectHtml = '', accountBadge = '';
           
           if (r.type === 'transfer') {
              const aF = assets.find(x => x.id === r.assetFrom)?.name || '?';
              const aT = assets.find(x => x.id === r.assetTo)?.name || '?';
              accountBadge = `<span class="bg-gray-200 px-1 rounded text-[8px] mr-1">${aF} ➔ ${aT}</span>`;
              catIconHtml = `<div class="p-3 rounded-full flex items-center justify-center bg-gray-100 text-gray-500"><i class="fas fa-exchange-alt text-sm"></i></div>`;
              catSelectHtml = `<span class="font-bold text-gray-800">資金移轉</span>`;
           } else {
              const cat = categories.find(c => c.id === r.cat) || categories[0];
              const aName = assets.find(x => x.id === r.assetId)?.name || '?';

    window.parseCSVLine = (line) => { const res = []; let cur = '', inQ = false; for(let i=0;i<line.length;i++){ const c = line[i]; if(inQ){ if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; } else if(c==='"') inQ = false; else cur+=c; } else { if(c==='"') inQ=true; else if(c===','){ res.push(cur); cur=''; } else cur+=c; } } res.push(cur); return res.map(v=>v.trim()); };

    window.importInvoiceCSV = (event) => {
      const file = event.target.files[0]; if(!file) return; const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const lines = e.target.result.split(/\r?\n/).filter(l => l.trim()), invoiceMap = new Map(); let newC = 0, skipC = 0;
          for(let i=1;i<lines.length;i++) {
             const cols = parseCSVLine(lines[i]); if(cols.length < 8) continue;
             const invNum = cols[2], amt = parseInt(cols[3]); if(!invNum?.match(/^[A-Z0-9]{2}\d{8}$/) || isNaN(amt)) continue;
             if(!invoiceMap.has(invNum)) invoiceMap.set(invNum, { dateRaw: cols[1], amount: amt, shopName: cols[7], items: cols[13]?[cols[13]]:[] });
             else { const d = invoiceMap.get(invNum); if(cols[13] && !d.items.includes(cols[13])) d.items.push(cols[13]); if(amt > d.amount) d.amount = amt; }
          }
          invoiceMap.forEach((d, invNum) => {
              const formattedDate = d.dateRaw.includes('/') ? d.dateRaw.replace(/\//g, '-') : (d.dateRaw.length===8 ? `${d.dateRaw.substring(0,4)}-${d.dateRaw.substring(4,6)}-${d.dateRaw.substring(6,8)}` : new Date().toISOString().split('T')[0]);
              if(!records.some(r => r.id === `INV_${invNum}`)) { 
                  const rec = { id: `INV_${invNum}`, type: 'expense', amount: d.amount, cat: autoCategorize(d.shopName), assetId: assets[0]?.id || 'asset_cash', date: formattedDate, note: `${d.shopName}${d.items.length ? ` (${d.items.slice(0,2).join('、')}${d.items.length>2?'...':''})` : ''}` };
                  records.push(rec); newC++; 
                  if(assets[0]) assets[0].balance -= d.amount; // 預設扣除現金
              } else skipC++;
          });
          if(newC > 0) { 
              records.sort((a,b)=>new Date(b.date)-new Date(a.date)); 
              localStorage.setItem('my_expenses', JSON.stringify(records)); 
              localStorage.setItem('my_assets', JSON.stringify(assets));
              initDateFilters(); if(currentTab==='stats') updateStatsView(); showToast(`✅ 匯入 ${newC} 張新發票`); executeDriveUpload(true);
          } else showToast(`⚠️ 無新發票`);
        } catch(err) { showToast('❌ 解析失敗'); } event.target.value = ''; 
      }; reader.readAsText(file, 'UTF-8'); 
    };

    window.syncFromDrive = async (t) => {

        const sr = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${SYNC_FILE_NAME}'&fields=files(id,name,modifiedTime)`, { headers: { 'Authorization': `Bearer ${t}` } });
        const sd = await sr.json();

          localStorage.setItem('drive_file_id', sd.files[0].id);
          const cr = await fetch(`https://www.googleapis.com/drive/v3/files/${sd.files[0].id}?alt=media`, { headers: { 'Authorization': `Bearer ${t}` } });
          const cloudData = await cr.json();
          let cRec = [];
          if(Array.isArray(cloudData)) cRec = cloudData; 
          else { cRec = cloudData.records || []; if(cloudData.categories) categories = cloudData.categories; if(cloudData.assets) assets = cloudData.assets; }
          
          localStorage.setItem('my_categories', JSON.stringify(categories));
          localStorage.setItem('my_assets', JSON.stringify(assets));

          const lid = new Set(records.map(r=>r.id)), nC = cRec.filter(r=>!lid.has(r.id)), cid = new Set(cRec.map(r=>r.id)), nL = records.filter(r=>!cid.has(r.id));
          if(nC.length || nL.length) {
            records = [...records, ...nC].sort((a,b)=>new Date(b.date)-new Date(a.date));

          } else { const now = new Date(); localStorage.setItem('last_sync_timestamp', now.getTime()); localStorage.setItem('last_sync_time', now.toLocaleTimeString()); updateSyncUI(true); showToast('資料已是最新狀態'); }
        }

    window.executeDriveUpload = async (isAuto = true) => {
      const t = localStorage.getItem('gdrive_token'); if(!t) { if(!isAuto) showToast('請先連線雲端'); return; }
      if(!isAuto) showToast('⏳ 正在同步...');
      const payload = { version: 2, records, categories, assets };
      const body = JSON.stringify(payload), fid = localStorage.getItem('drive_file_id');
      try {
        let res;
        if(fid) res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' }, body });
        else { const fm = new FormData(); fm.append('metadata', new Blob([JSON.stringify({name: SYNC_FILE_NAME, mimeType: 'application/json'})], {type: 'application/json'})); fm.append('file', new Blob([body], {type: 'application/json'})); res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { 'Authorization': `Bearer ${t}` }, body: fm }); if(res.ok) localStorage.setItem('drive_file_id', (await res.json()).id); }
        if(res.ok) { const now = new Date(); localStorage.setItem('last_sync_timestamp', now.getTime()); localStorage.setItem('last_sync_time', now.toLocaleTimeString()); updateSyncUI(true); if(!isAuto) showToast('✅ 雲端同步成功！'); } else if(res.status===401) { localStorage.removeItem('gdrive_token'); updateSyncUI(false); }
      } catch(e) { if(!isAuto) showToast('❌ 網路錯誤'); }
    };

    window.exportData = () => { if(records.length===0 && assets.length===0) return showToast('無資料可匯出'); const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ version: 2, records, categories, assets })); a.download = `expense_backup_${new Date().toISOString().split('T')[0]}.json`; a.click(); showToast('✅ 備份下載成功'); };
    window.importData = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { try { const imp = JSON.parse(ev.target.result); if(Array.isArray(imp)) records = imp; else { records = imp.records||[]; if(imp.categories) categories = imp.categories; if(imp.assets) assets = imp.assets; } localStorage.setItem('my_expenses', JSON.stringify(records)); localStorage.setItem('my_categories', JSON.stringify(categories)); localStorage.setItem('my_assets', JSON.stringify(assets)); initDateFilters(); renderAssetSelects(); showToast('✅ 還原成功'); executeDriveUpload(true); } catch(err){ showToast('❌ 格式錯誤'); } e.target.value = ''; }; r.readAsText(f); };
    window.clearAllData = () => { if(confirm('警告：確定刪除所有資料？')) { records = []; assets = [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; localStorage.removeItem('my_expenses'); localStorage.setItem('my_assets', JSON.stringify(assets)); initDateFilters(); renderAssetSelects(); showToast('已清空'); executeDriveUpload(true); } };

    window.onload = init;
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleClient()"></script>
</body>
