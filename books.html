<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent; bottom: 0; color: transparent; cursor: pointer;
      height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center font-sans h-[100dvh] overflow-hidden relative">

  <!-- ===================================================================== -->
  <!--                        [共用] 認證登入與彈出視窗                       -->
  <!-- ===================================================================== -->
  
  <!-- 認證登入畫面 -->
  <div id="auth-screen" class="fixed inset-0 bg-gray-900/95 z-[90] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-11/12 max-w-sm text-center transform transition-transform">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fab fa-google text-3xl"></i>
      </div>
      <h2 id="auth-title" class="text-xl font-bold text-gray-800 mb-2">歡迎來到極簡記帳</h2>
      <p class="text-sm text-gray-500 mb-8">請使用 Google 帳號登入以同步您的雲端資料</p>
      
      <p id="auth-error" class="text-red-500 text-xs mb-4 h-auto opacity-0 transition-opacity">錯誤訊息</p>
      
      <button id="auth-submit-btn" onclick="signInWithGoogle()" class="w-full flex items-center justify-center py-3.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold rounded-xl shadow-sm transition-all active:scale-[0.98] mb-4">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3" alt="Google">
        <span id="auth-btn-text">使用 Google 帳號登入</span>
      </button>
    </div>
  </div>

  <!-- 分類管理彈出視窗 (Modal) -->
  <div id="category-modal" class="fixed inset-0 bg-gray-900/80 z-[110] flex flex-col items-center justify-end md:justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-[400px] p-6 pb-10 shadow-2xl transform transition-transform translate-y-full md:translate-y-0 h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h3 id="cat-modal-title" class="text-lg font-bold text-gray-800">新增分類</h3>
        <button onclick="closeCategoryModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-1">
        <input type="hidden" id="cat-id-input">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">分類名稱</label>
          <input type="text" id="cat-name-input" placeholder="例如：寵物、醫療..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇圖示</label>
          <div id="cat-icon-picker" class="grid grid-cols-6 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇顏色</label>
          <div id="cat-color-picker" class="grid grid-cols-5 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">自動歸類關鍵字 (以逗號分隔)</label>
          <textarea id="cat-keywords-input" rows="3" placeholder="例如：動物醫院,寵物公園,肉泥..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500 resize-none"></textarea>
          <p class="text-[10px] text-gray-400 mt-1">匯入發票時，若店家名稱包含上述任一關鍵字，會自動歸入此分類。</p>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100 flex space-x-3 shrink-0">
         <button id="cat-delete-btn" onclick="deleteCurrentCategory()" class="hidden px-4 py-3 bg-red-50 text-red-600 font-bold rounded-xl active:scale-95 transition-all"><i class="fas fa-trash"></i></button>
         <button onclick="saveCategory()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
           儲存分類
         </button>
      </div>
    </div>
  </div>

  <!-- APP 容器框架 -->
  <div class="w-full max-w-[400px] h-full md:h-[800px] bg-gray-50 md:rounded-[3rem] md:shadow-2xl relative overflow-hidden flex flex-col md:border-[8px] border-gray-900">
    
    <!-- 頂部 Header -->
    <header class="bg-white px-4 pt-10 pb-3 shadow-sm z-10 flex justify-between items-center shrink-0 h-16">
      <div class="text-base font-bold text-gray-800 tracking-wide">極簡記帳</div>
      <div class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200 text-xs font-bold shadow-sm transition-all" id="firebase-status">
        <i class="fas fa-spinner fa-spin"></i><span>連線中...</span>
      </div>
    </header>

    <!-- 提示框 -->
    <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm flex items-center opacity-0 pointer-events-none transition-opacity duration-300">
      <i class="fas fa-check-circle text-green-400 mr-2"></i><span id="toast-msg">操作成功</span>
    </div>

    <!-- 主要視圖區塊 (View Container) -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
      
      <!-- ===================================================================== -->
      <!--                         [頁面一] 記帳 (Add)                          -->
      <!-- ===================================================================== -->
      <div id="view-add" class="p-3 space-y-3 flex-1 flex flex-col justify-center">
        
        <!-- 選擇分類 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
          <label class="block text-xs font-medium text-gray-700 mb-2">選擇分類</label>
          <div id="category-container" class="grid grid-cols-4 gap-2">
            <!-- JS 動態生成按鈕 -->
          </div>
        </div>
        
        <!-- 日期、金額與備註區塊 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">日期</label>
            <input type="date" id="input-date" class="w-full p-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors">
          </div>
          <div class="p-3 bg-blue-50/40 rounded-xl border border-blue-100 border-l-4 border-l-blue-500 relative">
            <label class="block text-xs font-medium text-blue-600 mb-1">消費金額</label>
            <div class="flex items-center text-3xl font-bold text-gray-800">
              <span class="mr-2 text-gray-400">$</span>
              <input type="number" id="input-amount" inputmode="numeric" pattern="[0-9]*" placeholder="0" class="w-full bg-transparent border-none outline-none focus:ring-0 p-0 tracking-tight">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">備註 (選填)</label>
            <input type="text" id="input-note" placeholder="例如：晚餐、捷運..." class="w-full p-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors">
          </div>
        </div>

        <button onclick="addRecord()" class="w-full mt-2 py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-xl shadow-md shadow-blue-200 transition-all active:scale-[0.98]">
          儲存紀錄
        </button>
      </div>

      <!-- ===================================================================== -->
      <!--                         [頁面二] 統計 (Stats)                        -->
      <!-- ===================================================================== -->
      <div id="view-stats" class="p-3 space-y-3 hidden" style="touch-action: pan-y;">
        
        <!-- 篩選列 -->
        <div class="flex space-x-2">
          <select id="filter-year" onchange="updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center"></select>
          <select id="filter-month" onchange="updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center">
            <option value="all">全年</option>
            <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
            <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
            <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
          </select>
        </div>
        
        <!-- 搜尋列 -->
        <div class="flex space-x-2">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="input-search" placeholder="搜尋備註與分類..." oninput="handleSearch()" class="w-full pl-9 p-2.5 text-sm font-medium bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors shadow-sm">
          </div>
          <button id="btn-clear-filter" onclick="clearCategoryFilter()" class="hidden px-3 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold hover:bg-gray-200 transition-colors shadow-sm whitespace-nowrap active:scale-95">清除篩選</button>
        </div>

        <!-- 總計顯示 -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-4 text-white shadow-md relative overflow-hidden">
          <h3 id="stats-title-text" class="text-blue-100 text-xs font-medium mb-1 transition-all duration-300 transform origin-left">本月總支出</h3>
          <div id="total-expense" class="text-3xl font-bold tracking-tight">$0</div>
          <i class="fas fa-hand-pointer absolute right-4 top-1/2 -translate-y-1/2 text-white/20 text-4xl animate-pulse hidden md:block"></i>
        </div>

        <!-- 圓餅圖與明細 -->
        <div id="stats-card" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
          <h3 class="w-full text-left text-sm font-bold text-gray-800 mb-2">支出結構 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊圖表可篩選)</span></h3>
          <div class="relative flex items-center justify-center h-32 w-32">
            <canvas id="pieChart" width="128" height="128" class="cursor-pointer transition-transform hover:scale-105"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
               <span class="text-gray-400 text-[10px]">Total</span>
            </div>
          </div>
          <div id="stats-breakdown" class="w-full mt-4 space-y-1"></div>
        </div>

        <!-- 紀錄清單 -->
        <div>
          <h3 id="history-list-title" class="text-sm font-bold text-gray-800 mb-2 px-1">區間紀錄 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊文字可直接修改)</span></h3>
          <div id="history-list" class="space-y-2 pb-4"></div>
        </div>
      </div>

      <!-- ===================================================================== -->
      <!--                         [頁面三] 設定 (Settings)                       -->
      <!-- ===================================================================== -->
      <div id="view-settings" class="p-3 space-y-3 hidden">

        <!-- 分類管理區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-center">
            <div>
              <h2 class="text-lg font-bold text-gray-800">分類與發票關鍵字</h2>
              <p class="text-xs text-gray-500 mt-1">管理分類並設定發票自動歸類規則。</p>
            </div>
            <button onclick="openCategoryModal()" class="shrink-0 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm">
              <i class="fas fa-plus"></i> 新增
            </button>
          </div>
          <div class="p-4">
            <div id="settings-category-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div>
          </div>
        </div>
        
        <!-- 雲端發票整合區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50">
            <h2 class="text-lg font-bold text-gray-800">雲端發票整合</h2>
            <p class="text-xs text-gray-500 mt-1">強烈建議使用「CSV 手動匯入」，100% 成功且免申請。</p>
          </div>
          <div class="p-4 space-y-4">
            <div class="space-y-2">
              <h3 class="text-xs font-bold text-gray-800"><i class="fas fa-file-csv mr-1"></i> 推薦做法：手動匯入明細表</h3>
              <div class="relative">
                <input type="file" id="import-invoice-file" accept=".csv" onchange="importInvoiceCSV(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <button class="w-full flex items-center justify-center py-3 bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 rounded-xl text-sm font-bold shadow-sm transition-all">
                  <i class="fas fa-upload mr-2"></i> 選擇並匯入財政部 CSV 檔
                </button>
              </div>
              <p class="text-[10px] text-gray-500 leading-relaxed pl-1">👉 步驟：登入財政部平台 > 載具消費發票查詢 > 下載明細</p>
            </div>
            
            <details class="group mt-2">
              <summary class="cursor-pointer text-xs font-bold text-gray-500 hover:text-gray-700 flex items-center">
                <i class="fas fa-bolt mr-2 w-3 text-center"></i> API 自動同步 (進階選項)
                <i class="fas fa-chevron-down ml-auto transition-transform group-open:rotate-180"></i>
              </summary>
              <div class="space-y-3 bg-gray-50 p-3 rounded-xl border border-gray-200 mt-3">
                 <input type="text" id="api-barcode" placeholder="手機條碼 (例如 /AB12345)" class="w-full p-2.5 text-sm bg-white border border-gray-200 rounded-lg outline-none uppercase">
                 <input type="password" id="api-password" placeholder="驗證碼 (密碼)" class="w-full p-2.5 text-sm bg-white border border-gray-200 rounded-lg outline-none">
                 <input type="text" id="api-appid" placeholder="請貼上您舊有的 AppID" class="w-full p-2.5 text-sm bg-white border border-gray-200 rounded-lg outline-none text-gray-800">
                 <button onclick="fetchInvoicesAPI()" class="w-full py-2.5 bg-gray-600 text-white rounded-lg text-sm font-bold shadow-sm active:scale-95">嘗試 API 同步</button>
              </div>
            </details>
          </div>
        </div>

        <!-- 備份區塊 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-start">
            <div><h2 class="text-lg font-bold text-gray-800">資料備份與還原</h2></div>
            <i class="fas fa-database text-blue-500 text-xl mt-1"></i>
          </div>
          <div class="p-4 space-y-3">
            <button onclick="executeDriveUpload()" class="w-full py-2.5 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fab fa-google-drive mr-2"></i> 備份至 Google Drive</button>
            <button onclick="syncFromDriveManual()" class="w-full py-2.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fas fa-cloud-download-alt mr-2"></i> 從 Drive 下載合併</button>
            <button onclick="exportData()" class="w-full py-2.5 bg-gray-50 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium active:scale-95 transition-all"><i class="fas fa-download mr-2"></i> 下載備份檔 (JSON)</button>
            <div class="relative">
              <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <button class="w-full py-2.5 bg-gray-50 text-gray-600 rounded-lg text-sm font-medium border border-gray-200 pointer-events-none transition-all"><i class="fas fa-upload mr-2"></i> 從 JSON 檔案還原</button>
            </div>
          </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm border border-red-100 overflow-hidden mt-4">
           <div class="p-4 space-y-3">
             <button onclick="handleLogout()" class="w-full py-2.5 bg-orange-50 text-orange-600 rounded-lg text-sm font-medium"><i class="fas fa-sign-out-alt mr-2"></i> 登出帳號</button>
             <button onclick="clearAllData()" class="w-full py-2.5 bg-red-50 text-red-600 rounded-lg text-sm font-medium"><i class="fas fa-trash-alt mr-2"></i> 清空所有資料</button>
           </div>
        </div>
      </div>
    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-gray-100 px-6 pt-2 pb-6 md:pb-2 flex justify-around items-center z-10 w-full shrink-0">
      <button onclick="switchTab('stats')" id="nav-stats" class="flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-chart-pie text-xl"></i><span class="text-[10px] font-medium">統計</span></button>
      <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center space-y-1 text-blue-600 transition-colors"><i class="fas fa-plus-circle text-2xl"></i><span class="text-[10px] font-medium">記帳</span></button>
      <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-cog text-xl"></i><span class="text-[10px] font-medium">設定</span></button>
    </nav>
  </div>

  <!-- JavaScript 邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ============================================================================
    //                              [共用] 核心狀態與 Firebase 設定
    // ============================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDl3IYAAQGCwKLaSVGdY4ewZZlhVmu7dUg",
      authDomain: "book-dad94.firebaseapp.com",
      projectId: "book-dad94",
      storageBucket: "book-dad94.firebasestorage.app",
      messagingSenderId: "9435949525",
      appId: "1:9435949525:web:979b0a1afea30e40fcb55c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    
    let currentUser = null, unsubscribeFirestore = null, unsubscribeCatFirestore = null, isSigningIn = false;
    let categories = [], records = [], selectedCategoryId = 'food', currentTab = 'add';
    let currentSearchQuery = '', currentCategoryFilter = null, pieChartSlices = [];

    const DEFAULT_CATEGORIES = [
      { id: 'food', name: '餐飲', icon: 'fas fa-utensils', color: '#F59E0B', keywords: ['統一超商','全家','萊爾富','ＯＫ','麥當勞','便當','飲料','餐廳','咖啡','好市多','食品','家福'] },
      { id: 'clothes', name: '服飾', icon: 'fas fa-tshirt', color: '#EC4899', keywords: ['uniqlo','net','服飾','鞋','包','百貨'] },
      { id: 'housing', name: '居住', icon: 'fas fa-home', color: '#8B5CF6', keywords: ['全聯','大潤發','家樂福','寶雅','屈臣氏','康是美','五金','水電','瓦斯','電信','宜家家居'] },
      { id: 'transport', name: '交通', icon: 'fas fa-car', color: '#3B82F6', keywords: ['中油','台塑','加油','停車','台鐵','高鐵','捷運','客運','計程車','uber','機車'] },
      { id: 'education', name: '學習', icon: 'fas fa-book', color: '#10B981', keywords: ['書局','博客來','誠品','補習','文具'] },
      { id: 'entertainment', name: '娛樂', icon: 'fas fa-gamepad', color: '#EF4444', keywords: ['威秀','影城','電影','ktv','遊戲','app store','google play','蝦皮','健身'] },
      { id: 'other', name: '其他', icon: 'fas fa-ellipsis-h', color: '#6B7280', keywords: [] }
    ];

    try {
        const savedCats = localStorage.getItem('my_categories');
        categories = savedCats ? JSON.parse(savedCats) : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        if (!Array.isArray(categories) || categories.length === 0) categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    } catch (e) { categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)); }

    try {
        const savedRecords = localStorage.getItem('my_expenses');
        records = savedRecords ? JSON.parse(savedRecords) : [];
        if (!Array.isArray(records)) records = [];
    } catch (e) { records = []; }

    window.switchTab = (tab) => {
      currentTab = tab;
      ['add', 'stats', 'settings'].forEach(t => document.getElementById(`view-${t}`).classList.add('hidden'));
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.querySelectorAll('nav button').forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-gray-400'); });
      document.getElementById(`nav-${tab}`).classList.replace('text-gray-400', 'text-blue-600');
      if(tab === 'stats') window.updateStatsView();
      if(tab === 'settings') window.renderSettingsCategories();
    };

    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2000);
    };

    window.signInWithGoogle = async () => {
       if (isSigningIn) return; isSigningIn = true;
       const errorEl = document.getElementById('auth-error'), btnEl = document.getElementById('auth-submit-btn'), btnText = document.getElementById('auth-btn-text');
       if (errorEl) errorEl.classList.add('opacity-0');
       if (btnEl) btnEl.classList.add('opacity-50', 'pointer-events-none'); 
       if (btnText) btnText.innerText = '登入中...';
       try {
           googleProvider.setCustomParameters({ prompt: 'select_account' });
           const result = await signInWithPopup(auth, googleProvider);
           if (result && result.user) {
               document.getElementById('auth-screen').classList.add('opacity-0', 'pointer-events-none');
               setTimeout(() => { document.getElementById('auth-screen').style.display = 'none'; }, 300);
           }
       } catch (error) {
           if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
               if (errorEl) { errorEl.innerText = `發生錯誤 (${error.code})。`; errorEl.classList.remove('opacity-0'); }
           }
       } finally {
           isSigningIn = false;
           if (btnEl) btnEl.classList.remove('opacity-50', 'pointer-events-none');
           if (btnText) btnText.innerText = '使用 Google 帳號登入';
       }
    };

    window.handleLogout = async () => { await signOut(auth); window.showToast('已登出帳號'); };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const statusEl = document.getElementById('firebase-status'), authScreen = document.getElementById('auth-screen');
      if (user) {
        statusEl.innerHTML = '<i class="fas fa-wifi"></i><span>已連線</span>';
        statusEl.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-green-50 text-green-600 border border-green-200 text-xs font-bold shadow-sm transition-all";

        statusEl.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-red-50 text-red-600 border border-red-200 text-xs font-bold shadow-sm transition-all";
        authScreen.style.display = 'flex'; void authScreen.offsetWidth; authScreen.classList.remove('opacity-0', 'pointer-events-none');
        records = []; document.getElementById('history-list').innerHTML = '';
        if (unsubscribeFirestore) unsubscribeFirestore(); if (unsubscribeCatFirestore) unsubscribeCatFirestore();
      }
    });

    function setupFirestoreListener() {
      if (!currentUser) return;
      unsubscribeFirestore = onSnapshot(doc(db, 'users', currentUser.uid, 'sync', 'expenses'), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list) {
            records = docSnap.data().list.map(r => { r.date = r.date || new Date().toISOString().split('T')[0]; return r; }).sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('my_expenses', JSON.stringify(records));
            window.initDateFilters(); if (currentTab === 'stats') window.updateStatsView();
        }
      });
      unsubscribeCatFirestore = onSnapshot(doc(db, 'users', currentUser.uid, 'settings', 'categories'), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list && Array.isArray(docSnap.data().list) && docSnap.data().list.length > 0) {
            categories = docSnap.data().list; localStorage.setItem('my_categories', JSON.stringify(categories));
            window.renderCategories(); window.renderSettingsCategories(); if (currentTab === 'stats') window.updateStatsView();
        } else { window.syncCategoriesToCloud(); }
      });
    }

    window.syncCategoriesToCloud = async () => { if (currentUser) try { await setDoc(doc(db, 'users', currentUser.uid, 'settings', 'categories'), { list: categories }); } catch(e){} };
    window.syncExpensesToCloud = async () => { if (currentUser) try { await setDoc(doc(db, 'users', currentUser.uid, 'sync', 'expenses'), { list: records }); } catch(e){} };

    // ============================================================================
    //                              [頁面一] 記帳 (Add) 邏輯

    window.renderCategories = () => {
        const container = document.getElementById('category-container'); if(!container) return;

          <button onclick="selectCategory('${cat.id}')" class="cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-gray-50 border-transparent" data-id="${cat.id}">
            <div class="icon-wrap w-8 h-8 flex items-center justify-center rounded-full mb-1 transition-colors" style="background-color: #E5E7EB; color: #6B7280"><i class="${cat.icon} text-sm"></i></div><span class="text-[10px] transition-colors text-gray-600">${cat.name}</span>
          </button>`).join('');
        if(!categories.find(c => c.id === selectedCategoryId)) selectedCategoryId = categories[0]?.id || 'other';
        window.selectCategory(selectedCategoryId);
    };

    window.selectCategory = (id) => {
      selectedCategoryId = id;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const cat = categories.find(c => c.id === btn.dataset.id); if(!cat) return;

          btn.className = `cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-blue-50 border-blue-500`;

          btn.className = `cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-gray-50 border-transparent hover:bg-gray-100`;

          btn.querySelector('span').className = `text-[10px] transition-colors text-gray-600`;
        }
      });
    };

    window.addRecord = async () => {
      const amount = Number(document.getElementById('input-amount').value);
      if(!amount || amount <= 0) { window.showToast('請輸入有效的金額！'); return; }
      records.push({ id: Date.now().toString(), amount, cat: selectedCategoryId, date: document.getElementById('input-date').value, note: document.getElementById('input-note').value.trim() });
      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem('my_expenses', JSON.stringify(records));
      await window.syncExpensesToCloud();
      document.getElementById('input-amount').value = ''; document.getElementById('input-note').value = '';
      window.showToast('✅ 記帳成功！');

    // ============================================================================
    //                              [頁面二] 統計 (Stats) 邏輯
    // ============================================================================
    window.initDateFilters = (isFirstLoad = false) => {
      const yearSelect = document.getElementById('filter-year'), monthSelect = document.getElementById('filter-month'); if (!yearSelect) return;
      const currentSelectedYear = yearSelect.value, currentYear = new Date().getFullYear().toString();
      const years = new Set(records.map(r => r.date?.split('-')[0]).filter(Boolean)); years.add(currentYear);
      const sortedYears = Array.from(years).sort((a, b) => b - a);
      yearSelect.innerHTML = '<option value="all">全部年份</option>' + sortedYears.map(y => `<option value="${y}">${y}年</option>`).join('');
      if (!isFirstLoad && currentSelectedYear && sortedYears.includes(currentSelectedYear)) yearSelect.value = currentSelectedYear;
      else if (isFirstLoad || !currentSelectedYear) { yearSelect.value = currentYear; if(monthSelect) monthSelect.value = String(new Date().getMonth() + 1).padStart(2, '0'); }
    };

    window.updateStatsView = () => {
      const year = document.getElementById('filter-year')?.value || 'all', monthSelect = document.getElementById('filter-month'), month = monthSelect?.value || 'all';
      if (monthSelect) {
          if (year === 'all') { monthSelect.value = 'all'; monthSelect.disabled = true; monthSelect.classList.add('opacity-50', 'bg-gray-100'); } 
          else { monthSelect.disabled = false; monthSelect.classList.remove('opacity-50', 'bg-gray-100'); }
      }
      
      let filtered = records, titleText = '累積總支出';
      if (year !== 'all') {
          if (month !== 'all') { filtered = filtered.filter(r => r.date?.startsWith(`${year}-${month}`)); titleText = `${year}年 ${parseInt(month)}月 總支出`; } 
          else { filtered = filtered.filter(r => r.date?.startsWith(year)); titleText = `${year}年 總支出`; }
      }
      if (currentSearchQuery) filtered = filtered.filter(r => r.note?.toLowerCase().includes(currentSearchQuery) || categories.find(c => c.id === r.cat)?.name.includes(currentSearchQuery));

      document.getElementById('stats-title-text').innerText = titleText;
      let total = 0, totalsByCat = {};
      filtered.forEach(r => { total += r.amount; totalsByCat[r.cat] = (totalsByCat[r.cat] || 0) + r.amount; });
      document.getElementById('total-expense').innerText = `$${total.toLocaleString()}`;
      
      const canvas = document.getElementById('pieChart');
      if (canvas) {
          const ctx = canvas.getContext('2d'), cx = canvas.width/2, cy = canvas.height/2, radius = Math.min(cx, cy);
          ctx.clearRect(0, 0, canvas.width, canvas.height); pieChartSlices = [];
          if(total === 0) {
            ctx.fillStyle = '#f3f4f6'; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
            document.getElementById('stats-breakdown').innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">無資料</div>';
          } else {
            let startAngle = -0.5 * Math.PI, breakdownArr = [];
            categories.forEach(cat => {
              if(totalsByCat[cat.id]) {
                 const sliceAngle = (totalsByCat[cat.id] / total) * 2 * Math.PI, endAngle = startAngle + sliceAngle;
                 ctx.fillStyle = cat.color; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, startAngle, endAngle); ctx.closePath(); ctx.fill(); 
                 pieChartSlices.push({ id: cat.id, startAngle, endAngle }); startAngle = endAngle;
                 breakdownArr.push({ ...cat, amount: totalsByCat[cat.id], percent: ((totalsByCat[cat.id] / total) * 100).toFixed(1) });
              }
            });
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, radius * 0.6, 0, Math.PI * 2); ctx.fill();
            document.getElementById('stats-breakdown').innerHTML = breakdownArr.sort((a,b) => b.amount - a.amount).map(item => `
              <div onclick="window.filterByCategory('${item.id}')" class="flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-colors ${currentCategoryFilter === item.id ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50 border border-transparent'}">
                 <div class="flex items-center"><div class="w-3 h-3 rounded-full mr-2" style="background-color: ${item.color}"></div><span class="text-xs ${currentCategoryFilter === item.id ? 'font-bold text-blue-700' : 'text-gray-700'}">${item.name}</span></div>
                 <div class="flex items-center space-x-2"><span class="text-xs font-medium text-gray-900">$${item.amount.toLocaleString()}</span><span class="text-[10px] text-gray-400 w-8 text-right">${item.percent}%</span></div>
              </div>`).join('');
          }
      }

      let listRecords = currentCategoryFilter ? filtered.filter(r => r.cat === currentCategoryFilter) : filtered;
      const listTitle = document.getElementById('history-list-title');
      if (listTitle) listTitle.innerHTML = (currentSearchQuery || currentCategoryFilter) ? `篩選結果 <span class="text-blue-500 font-normal text-xs ml-1">${currentSearchQuery ? `關鍵字: "${currentSearchQuery}" ` : ''}${currentCategoryFilter ? categories.find(c => c.id === currentCategoryFilter)?.name : ''}</span>` : '區間紀錄 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊直接修改)</span>';

      const historyContainer = document.getElementById('history-list');
      if (historyContainer) {
          if(listRecords.length === 0) historyContainer.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm">此區間/條件下尚未有記帳紀錄</div>'; 
          else {
             const catOptionsTemplate = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
             historyContainer.innerHTML = listRecords.map(r => {
               const cat = categories.find(c => c.id === r.cat) || categories.find(c => c.id === 'other') || categories[0];
               return `<div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-transparent hover:border-blue-100 transition-colors group relative">
                   <div class="flex items-center space-x-3 w-[65%]">
                     <div class="relative shrink-0 cursor-pointer" title="更換分類">
                       <select onchange="window.updateRecordField('${r.id}', 'cat', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">${catOptionsTemplate.replace(`value="${cat.id}"`, `value="${cat.id}" selected`)}</select>
                       <div class="p-3 rounded-full flex items-center justify-center transition-transform group-hover:scale-105" style="background-color: ${cat.color}20; color: ${cat.color}"><i class="${cat.icon} text-sm"></i></div>
                     </div>
                     <div class="overflow-hidden flex-1">
                       <div class="font-bold text-gray-800 text-sm flex items-center relative"><div class="relative cursor-pointer"><select onchange="window.updateRecordField('${r.id}', 'cat', this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">${catOptionsTemplate.replace(`value="${cat.id}"`, `value="${cat.id}" selected`)}</select><span class="border-b border-transparent hover:border-blue-300 transition-colors">${cat.name}</span></div>${r.id.startsWith('INV') ? '<span class="ml-2 text-[8px] bg-orange-100 text-orange-600 px-1 py-0.5 rounded shrink-0 pointer-events-none">雲端發票</span>' : ''}</div>
                       <div class="flex items-center text-[10px] text-gray-500 mt-0.5 space-x-1"><input type="date" value="${r.date}" onchange="window.updateRecordField('${r.id}', 'date', this.value)" class="bg-transparent border-b border-transparent hover:border-blue-300 outline-none p-0 m-0 w-[76px] cursor-pointer text-[10px] transition-colors relative z-10"><span>•</span><input type="text" value="${r.note}" placeholder="新增備註..." onchange="window.updateRecordField('${r.id}', 'note', this.value)" class="bg-transparent border-b border-transparent hover:border-blue-300 focus:border-blue-500 outline-none p-0 m-0 flex-1 min-w-0 text-[10px] text-gray-500 transition-colors relative z-10"></div>
                     </div>
                   </div>
                   <div class="flex items-center justify-end space-x-1 w-[35%]"><span class="font-bold text-gray-800 text-sm">$</span><input type="number" value="${r.amount}" onchange="window.updateRecordField('${r.id}', 'amount', this.value)" class="bg-transparent border-b border-transparent hover:border-blue-300 focus:border-blue-500 outline-none p-0 m-0 w-12 sm:w-16 text-right font-bold text-gray-800 transition-colors relative z-10" inputmode="numeric"><button onclick="window.deleteRecord('${r.id}')" class="p-2 text-gray-300 hover:text-red-500 transition-colors shrink-0 ml-1 relative z-20"><i class="fas fa-trash-alt"></i></button></div>
                 </div>`;
             }).join('');
          }
      }
    };

    window.handleSearch = () => { currentSearchQuery = document.getElementById('input-search').value.toLowerCase(); window.updateStatsView(); };
    window.clearCategoryFilter = () => { currentCategoryFilter = null; document.getElementById('btn-clear-filter').classList.add('hidden'); window.updateStatsView(); };
    window.filterByCategory = (catId) => { if (currentCategoryFilter === catId) window.clearCategoryFilter(); else { currentCategoryFilter = catId; document.getElementById('btn-clear-filter').classList.remove('hidden'); window.updateStatsView(); } };

    window.updateRecordField = async (id, field, value) => {
      const index = records.findIndex(r => r.id === id); if (index === -1) return;
      if (field === 'amount') { value = Number(value); if (!value || value <= 0) { window.showToast('無效金額'); window.updateStatsView(); return; } } else if (field === 'note') value = value.trim();
      records[index][field] = value; if (field === 'date') records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem('my_expenses', JSON.stringify(records)); await window.syncExpensesToCloud();
      window.updateStatsView(); window.showToast('✅ 紀錄已自動儲存');
    };

    window.deleteRecord = async (id) => { if(confirm('確定要刪除這筆紀錄嗎？')) { records = records.filter(r => r.id !== id); localStorage.setItem('my_expenses', JSON.stringify(records)); await window.syncExpensesToCloud(); window.updateStatsView(); window.showToast('已刪除紀錄'); } };

    window.initSwipeGestures = () => {
        const statsView = document.getElementById('view-stats'); let touchStartX = 0, touchStartY = 0;
        if (!statsView) return;
        statsView.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive: true});
        statsView.addEventListener('touchend', e => {
            if (currentTab !== 'stats') return;
            const deltaX = e.changedTouches[0].screenX - touchStartX, deltaY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) window.changeDateByOffset(deltaX > 0 ? -1 : 1);
        }, {passive: true});
    };

    window.changeDateByOffset = (offset) => {
        const yearSelect = document.getElementById('filter-year'), monthSelect = document.getElementById('filter-month');
        if (!yearSelect || !monthSelect || yearSelect.value === 'all') return;
        let y = parseInt(yearSelect.value), mStr = monthSelect.value;
        if (mStr === 'all') y += offset; 
        else { let m = parseInt(mStr) + offset; if (m > 12) { m = 1; y++; } else if (m < 1) { m = 12; y--; } mStr = m.toString().padStart(2, '0'); }
        if (!Array.from(yearSelect.options).some(opt => opt.value === y.toString())) { yearSelect.innerHTML += `<option value="${y}">${y}年</option>`; }
        yearSelect.value = y.toString(); monthSelect.value = mStr;
        const titleEl = document.getElementById('stats-title-text'); if (titleEl) { titleEl.classList.add('scale-105', 'text-yellow-200'); setTimeout(() => titleEl.classList.remove('scale-105', 'text-yellow-200'), 300); }
        window.updateStatsView();
    };

    window.initCanvasClickListener = () => {
      document.getElementById('pieChart')?.addEventListener('click', e => {
        if (!pieChartSlices.length) return;
        const rect = e.target.getBoundingClientRect(), cx = e.target.width/2, cy = e.target.height/2, dx = (e.clientX - rect.left)*(e.target.width/rect.width) - cx, dy = (e.clientY - rect.top)*(e.target.height/rect.height) - cy;
        const distance = Math.sqrt(dx*dx + dy*dy), radius = Math.min(cx, cy);
        if (distance > radius || distance < radius*0.6) return;
        let angle = Math.atan2(dy, dx); if (angle < -0.5*Math.PI) angle += 2*Math.PI;
        const clickedSlice = pieChartSlices.find(s => angle >= s.startAngle && angle <= s.endAngle);
        if (clickedSlice) window.filterByCategory(clickedSlice.id);
      });
    };

    // ============================================================================
    //                              [頁面三] 設定 (Settings) 邏輯
    // ============================================================================
    const AVAILABLE_ICONS = ['fas fa-utensils', 'fas fa-tshirt', 'fas fa-home', 'fas fa-car', 'fas fa-book', 'fas fa-gamepad', 'fas fa-shopping-cart', 'fas fa-heart', 'fas fa-gift', 'fas fa-plane', 'fas fa-pills', 'fas fa-paw', 'fas fa-baby', 'fas fa-music', 'fas fa-laptop', 'fas fa-coffee', 'fas fa-camera', 'fas fa-dumbbell', 'fas fa-ellipsis-h'];
    const AVAILABLE_COLORS = ['#F59E0B', '#EC4899', '#8B5CF6', '#3B82F6', '#10B981', '#EF4444', '#6B7280', '#14B8A6', '#F43F5E', '#84CC16', '#FF8C00', '#2E8B57'];
    let selectedIconForCat = AVAILABLE_ICONS[0], selectedColorForCat = AVAILABLE_COLORS[0];

    window.openCategoryModal = (catId = null) => {
        const modal = document.getElementById('category-modal'), inner = modal.querySelector('div');
        modal.classList.remove('opacity-0', 'pointer-events-none'); inner.classList.remove('translate-y-full'); inner.classList.add('translate-y-0');

            const cat = categories.find(c => c.id === catId); document.getElementById('cat-modal-title').innerText = '編輯分類';

            selectedIconForCat = AVAILABLE_ICONS[0]; selectedColorForCat = AVAILABLE_COLORS[0]; document.getElementById('cat-delete-btn').classList.add('hidden');
        }
        window.renderCatModalPickers();
    };

    window.closeCategoryModal = () => { const modal = document.getElementById('category-modal'); modal.querySelector('div').classList.add('translate-y-full'); setTimeout(() => { modal.classList.add('opacity-0', 'pointer-events-none'); }, 300); };
    window.renderCatModalPickers = () => {
       document.getElementById('cat-icon-picker').innerHTML = AVAILABLE_ICONS.map(i => `<button onclick="window.selectModalIcon('${i}')" class="w-10 h-10 rounded-full border-2 ${selectedIconForCat===i ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-transparent bg-gray-100 text-gray-500'}"><i class="${i}"></i></button>`).join('');
       document.getElementById('cat-color-picker').innerHTML = AVAILABLE_COLORS.map(c => `<button onclick="window.selectModalColor('${c}')" class="w-8 h-8 rounded-full border-2 ${selectedColorForCat===c ? 'border-gray-800 scale-110' : 'border-transparent'}" style="background-color: ${c}">${selectedColorForCat===c ? '<i class="fas fa-check text-white text-xs"></i>' : ''}</button>`).join('');
    };
    window.selectModalIcon = (icon) => { selectedIconForCat = icon; window.renderCatModalPickers(); };
    window.selectModalColor = (color) => { selectedColorForCat = color; window.renderCatModalPickers(); };

    window.saveCategory = async () => {
        const idInput = document.getElementById('cat-id-input').value, name = document.getElementById('cat-name-input').value.trim();
        if(!name) return window.showToast('請輸入名稱');
        const keywords = document.getElementById('cat-keywords-input').value.split(',').map(k=>k.trim()).filter(k=>k);
        if (idInput) { const idx = categories.findIndex(c => c.id === idInput); if(idx!==-1) categories[idx] = { ...categories[idx], name, icon: selectedIconForCat, color: selectedColorForCat, keywords }; } 
        else categories.splice(categories.length - 1, 0, { id: 'cat_' + Date.now(), name, icon: selectedIconForCat, color: selectedColorForCat, keywords });
        localStorage.setItem('my_categories', JSON.stringify(categories)); await window.syncCategoriesToCloud();
        window.renderCategories(); window.renderSettingsCategories(); if(currentTab === 'stats') window.updateStatsView(); window.closeCategoryModal(); window.showToast('✅ 儲存成功');
    };

    window.deleteCurrentCategory = async () => {
        const idInput = document.getElementById('cat-id-input').value; if(!idInput || idInput === 'other' || !confirm('確定刪除？')) return;
        categories = categories.filter(c => c.id !== idInput); let changed = false;
        records.forEach(r => { if(r.cat === idInput) { r.cat = 'other'; changed = true; } });
        localStorage.setItem('my_categories', JSON.stringify(categories)); await window.syncCategoriesToCloud();
        if (changed) { localStorage.setItem('my_expenses', JSON.stringify(records)); await window.syncExpensesToCloud(); }
        window.renderCategories(); window.renderSettingsCategories(); if(currentTab === 'stats') window.updateStatsView(); window.closeCategoryModal(); window.showToast('✅ 已刪除');
    };

    window.renderSettingsCategories = () => {
        document.getElementById('settings-category-list').innerHTML = categories.map(cat => `
          <div onclick="window.openCategoryModal('${cat.id}')" class="flex items-center justify-between p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 border border-transparent hover:border-blue-200"><div class="flex items-center space-x-3"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0" style="background-color: ${cat.color}"><i class="${cat.icon} text-sm"></i></div><div class="overflow-hidden"><div class="text-sm font-bold text-gray-800">${cat.name}</div><div class="text-[10px] text-gray-500 w-48 truncate">${(cat.keywords||[]).join(', ') || '無關鍵字'}</div></div></div><i class="fas fa-edit text-gray-400 text-xs shrink-0"></i></div>`).join('');
    };

    window.autoCategorize = (shopName) => { const name = shopName.toLowerCase(); for (const cat of categories) { if (cat.keywords?.some(kw => name.includes(kw.toLowerCase()))) return cat.id; } return 'other'; };
    window.parseCSVLine = (line) => { const res = []; let cur = '', inQ = false; for(let i=0;i<line.length;i++){ const c = line[i]; if(inQ){ if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; } else if(c==='"') inQ = false; else cur+=c; } else { if(c==='"') inQ=true; else if(c===','){ res.push(cur); cur=''; } else cur+=c; } } res.push(cur); return res.map(v=>v.trim()); };

    window.importInvoiceCSV = (event) => {
      const file = event.target.files[0]; if(!file) return; const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const lines = e.target.result.split(/\r?\n/).filter(l => l.trim()), invoiceMap = new Map(); let newC = 0, skipC = 0;
          for(let i=1;i<lines.length;i++) {
             const cols = window.parseCSVLine(lines[i]); if(cols.length < 8) continue;
             const invNum = cols[2], amt = parseInt(cols[3]); if(!invNum?.match(/^[A-Z0-9]{2}\d{8}$/) || isNaN(amt)) continue;
             if(!invoiceMap.has(invNum)) invoiceMap.set(invNum, { dateRaw: cols[1], amount: amt, shopName: cols[7], items: cols[13]?[cols[13]]:[] });
             else { const d = invoiceMap.get(invNum); if(cols[13] && !d.items.includes(cols[13])) d.items.push(cols[13]); if(amt > d.amount) d.amount = amt; }
          }
          invoiceMap.forEach((d, invNum) => {
              const formattedDate = d.dateRaw.includes('/') ? d.dateRaw.replace(/\//g, '-') : (d.dateRaw.length===8 ? `${d.dateRaw.substring(0,4)}-${d.dateRaw.substring(4,6)}-${d.dateRaw.substring(6,8)}` : new Date().toISOString().split('T')[0]);
              if(!records.some(r => r.id === `INV_${invNum}`)) { records.push({ id: `INV_${invNum}`, amount: d.amount, cat: window.autoCategorize(d.shopName), date: formattedDate, note: `${d.shopName}${d.items.length ? ` (${d.items.slice(0,2).join('、')}${d.items.length>2?'...':''})` : ''}` }); newC++; } else skipC++;
          });
          if(newC > 0) { records.sort((a,b)=>new Date(b.date)-new Date(a.date)); localStorage.setItem('my_expenses', JSON.stringify(records)); await window.syncExpensesToCloud(); window.initDateFilters(); if(currentTab==='stats') window.updateStatsView(); window.showToast(`✅ 匯入 ${newC} 張新發票`); } else window.showToast(`⚠️ 無新發票`);
        } catch(err) { window.showToast('❌ 解析失敗'); } event.target.value = ''; 
      }; reader.readAsText(file, 'UTF-8'); 
    };

    window.fetchInvoicesAPI = async () => {
      const bc = document.getElementById('api-barcode').value.trim().toUpperCase(), pwd = document.getElementById('api-password').value.trim(), appId = document.getElementById('api-appid').value.trim();
      if(!bc||!pwd||!appId) return window.showToast('資料不齊全');
      localStorage.setItem('api_barcode',bc); localStorage.setItem('api_password',pwd); localStorage.setItem('api_appid',appId); window.showToast('⏳ 同步中...');
      const now = new Date(), y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
      const params = new URLSearchParams({version:'0.5',cardType:'3J0002',cardNo:bc,expTimeStamp:'2147483647',action:'carrierInvChk',timeStamp:Math.floor(Date.now()/1000)+10,startDate:`${y}/${m}/01`,endDate:`${y}/${m}/${d}`,onlyWinningInv:'N',uuid:crypto.randomUUID?.()||Math.random().toString(),appID:appId,cardEncrypt:pwd});
      try {
        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.einvoice.nat.gov.tw/PB2CAPIVAN/invServ/InvServ'), { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:params.toString() });
        const data = await res.json(); let newC = 0;
        if(data.code==='200' && data.details) {
            data.details.forEach(inv => { if(!records.some(r=>r.id===`INV_${inv.invNum}`)) { records.push({id:`INV_${inv.invNum}`, amount:parseInt(inv.amount), cat:window.autoCategorize(inv.sellerName), date:(inv.invDate||'').replace(/\//g,'-'), note:`${inv.sellerName} (API)`}); newC++; } });
            if(newC>0) { records.sort((a,b)=>new Date(b.date)-new Date(a.date)); localStorage.setItem('my_expenses',JSON.stringify(records)); await window.syncExpensesToCloud(); window.initDateFilters(); if(currentTab==='stats') window.updateStatsView(); window.showToast(`✅ 同步 ${newC} 張`); } else window.showToast('無新發票');
        } else window.showToast('❌ API 錯誤');
      } catch(e) { window.showToast('❌ 連線失敗'); }
    };

    let tokenClient;
    window.initGoogleClient = () => { if(typeof google!=='undefined'&&google.accounts) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: '939340478771-4bupp9mrpr55j1j4domrb4g6pehm86j5.apps.googleusercontent.com', scope: 'https://www.googleapis.com/auth/drive.file', callback: async (t) => { if(t?.access_token) localStorage.getItem('pending_drive_action')==='upload' ? window.performDriveUpload(t.access_token) : window.performDriveDownload(t.access_token); } }); };
    setInterval(() => { if(typeof google!=='undefined'&&google.accounts&&!tokenClient) window.initGoogleClient(); }, 500);

    window.executeDriveUpload = () => { if(!tokenClient) return window.showToast("載入中"); localStorage.setItem('pending_drive_action','upload'); tokenClient.requestAccessToken({prompt:'select_account'}); };
    window.syncFromDriveManual = () => { if(!tokenClient) return window.showToast("載入中"); localStorage.setItem('pending_drive_action','download'); tokenClient.requestAccessToken({prompt:'select_account'}); };

    window.performDriveUpload = async (token) => {
      window.showToast('⏳ 上傳至 Drive...'); let fid = localStorage.getItem('drive_file_id');
      try {
        if(!fid) { const search = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=name='極簡記帳備份_AutoSync.json'`,{headers:{'Authorization':`Bearer ${token}`}})).json(); if(search.files?.length) fid = search.files[0].id; }
        const body = JSON.stringify({records, categories}); let res;
        if(fid) res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body});
        else { const form = new FormData(); form.append('metadata',new Blob([JSON.stringify({name:'極簡記帳備份_AutoSync.json',mimeType:'application/json'})],{type:'application/json'})); form.append('file',new Blob([body],{type:'application/json'})); res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':`Bearer ${token}`},body:form}); }
        if(res.ok) { localStorage.setItem('drive_file_id', (await res.json()).id || fid); window.showToast('✅ 備份成功'); } else throw new Error();
      } catch(e) { window.showToast('❌ 備份失敗'); }
    };

    window.performDriveDownload = async (token) => {
      window.showToast('⏳ 下載自 Drive...');
      try {
        const search = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=name='極簡記帳備份_AutoSync.json'`,{headers:{'Authorization':`Bearer ${token}`}})).json();
        if(search.files?.length) {
          const txt = await (await fetch(`https://www.googleapis.com/drive/v3/files/${search.files[0].id}?alt=media`,{headers:{'Authorization':`Bearer ${token}`}})).text();
          const imp = JSON.parse(txt), cRec = Array.isArray(imp)?imp:(imp.records||[]);
          if(imp.categories) { categories = imp.categories; localStorage.setItem('my_categories',JSON.stringify(categories)); window.syncCategoriesToCloud(); window.renderCategories(); window.renderSettingsCategories(); }
          const localIds = new Set(records.map(r=>r.id)), newRecs = cRec.filter(r=>!localIds.has(r.id));
          if(newRecs.length) { records=[...records,...newRecs].sort((a,b)=>new Date(b.date)-new Date(a.date)); localStorage.setItem('my_expenses',JSON.stringify(records)); window.syncExpensesToCloud(); window.showToast(`✅ 合併 ${newRecs.length} 筆資料`); if(currentTab==='stats') window.updateStatsView(); } else window.showToast('已是最新的');
        } else window.showToast('❌ 找不到備份檔');
      } catch(e) { window.showToast('❌ 下載失敗'); }
    };

    window.exportData = () => { const a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({records,categories})); a.download=`expense_backup_${new Date().toISOString().split('T')[0]}.json`; a.click(); window.showToast('✅ 下載成功'); };
    window.importData = (e) => {
      const f=e.target.files[0]; if(!f) return; const r=new FileReader();
      r.onload=async(ev)=>{ try{ const imp=JSON.parse(ev.target.result); if(imp.categories){ categories=imp.categories; localStorage.setItem('my_categories',JSON.stringify(categories)); await window.syncCategoriesToCloud(); window.renderCategories(); window.renderSettingsCategories(); } records=(Array.isArray(imp)?imp:imp.records||[]).sort((a,b)=>new Date(b.date)-new Date(a.date)); localStorage.setItem('my_expenses',JSON.stringify(records)); await window.syncExpensesToCloud(); window.showToast('✅ 還原成功'); window.initDateFilters(); if(currentTab==='stats') window.updateStatsView(); }catch(err){ window.showToast('❌ 格式錯誤'); } e.target.value=''; }; r.readAsText(f);
    };
    window.clearAllData = async () => { if(confirm('警告：確定刪除所有資料？')) { records=[]; localStorage.setItem('my_expenses',JSON.stringify([])); await window.syncExpensesToCloud(); window.showToast('已清空'); } };

    // ============================================================================
    //                              🚀 初始載入與執行
    // ============================================================================
    window.onload = () => {
      const dateInput = document.getElementById('input-date'); if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
      window.renderCategories(); window.renderSettingsCategories(); window.initDateFilters(true); window.initCanvasClickListener(); window.initSwipeGestures();
      ['api-barcode','api-password','api-appid'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = localStorage.getItem(id.replace('-','_'))||''; });
    };
  </script>
</body>
