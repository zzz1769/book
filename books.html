<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      background: transparent; bottom: 0; color: transparent; cursor: pointer;
      height: auto; left: 0; position: absolute; right: 0; top: 0; width: auto;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center font-sans h-[100dvh] overflow-hidden relative">

  <!-- ================= 認證登入畫面 (Google Firebase Auth) ================= -->
  <div id="auth-screen" class="fixed inset-0 bg-gray-900/95 z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="bg-white p-8 rounded-[2rem] shadow-2xl w-11/12 max-w-sm text-center transform transition-transform">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fab fa-google text-3xl"></i>
      </div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">歡迎來到極簡記帳</h2>
      <p class="text-sm text-gray-500 mb-8">請使用 Google 帳號登入以自動同步雲端資料</p>
      
      <p id="auth-error" class="text-red-500 text-xs mb-4 h-auto opacity-0 transition-opacity">錯誤訊息</p>
      
      <button id="auth-submit-btn" onclick="window.signInWithGoogle()" class="w-full flex items-center justify-center py-3.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold rounded-xl shadow-sm transition-all active:scale-[0.98] mb-4">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3" alt="Google">
        <span id="auth-btn-text">使用 Google 帳號登入</span>
      </button>
    </div>
  </div>

  <!-- 分類管理彈出視窗 (Modal) -->
  <div id="category-modal" class="fixed inset-0 bg-gray-900/80 z-[110] flex flex-col items-center justify-end md:justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-[400px] p-6 pb-10 shadow-2xl transform transition-transform translate-y-full md:translate-y-0 h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h3 id="cat-modal-title" class="text-lg font-bold text-gray-800">新增分類</h3>
        <button onclick="window.closeCategoryModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="flex-1 overflow-y-auto no-scrollbar space-y-4 pr-1">
        <input type="hidden" id="cat-id-input">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">分類類型</label>
          <select id="cat-type-input" class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">分類名稱</label>
          <input type="text" id="cat-name-input" placeholder="例如：寵物、醫療..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇圖示</label>
          <div id="cat-icon-picker" class="grid grid-cols-6 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">選擇顏色</label>
          <div id="cat-color-picker" class="grid grid-cols-5 gap-2"></div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">自動歸類關鍵字 (以逗號分隔)</label>
          <textarea id="cat-keywords-input" rows="3" placeholder="例如：動物醫院,寵物公園,肉泥..." class="w-full p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100 flex space-x-3 shrink-0">
         <button id="cat-delete-btn" onclick="window.deleteCurrentCategory()" class="hidden px-4 py-3 bg-red-50 text-red-600 font-bold rounded-xl active:scale-95 transition-all"><i class="fas fa-trash"></i></button>
         <button onclick="window.saveCategory()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
           儲存分類
         </button>
      </div>
    </div>
  </div>

  <!-- 資產管理彈出視窗 (Modal) -->
  <div id="asset-modal" class="fixed inset-0 bg-gray-900/80 z-[120] flex flex-col items-center justify-end md:justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
    <div class="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-[400px] p-6 pb-10 shadow-2xl transform transition-transform translate-y-full md:translate-y-0 h-auto flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center mb-4 shrink-0">
        <h3 id="asset-modal-title" class="text-lg font-bold text-gray-800">新增資產</h3>
        <button onclick="window.closeAssetModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200"><i class="fas fa-times"></i></button>
      </div>
      
      <div class="space-y-4 flex-1 overflow-y-auto no-scrollbar">
        <input type="hidden" id="asset-id-input">
        
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">資產類別</label>
          <select id="asset-type-input" onchange="window.handleAssetTypeChange()" class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
            <option value="cash">現金</option>
            <option value="deposit">存款</option>
            <option value="investment">投資 (基金/虛擬幣等)</option>
            <option value="stock">股票庫存 (證券戶)</option>
            <option value="credit">信用貸款</option>
            <option value="mortgage">房屋貸款</option>
          </select>
        </div>

        <!-- 一般資產輸入區塊 -->
        <div id="standard-asset-fields" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">資產名稱 (例如帳戶名稱)</label>
            <input type="text" id="asset-name-input" placeholder="例如：台新銀行、元大證券..." class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500">
          </div>
          <div id="asset-balance-wrapper">
            <label class="block text-xs font-medium text-gray-700 mb-1">當前金額</label>
            <input type="number" id="asset-balance-input" inputmode="numeric" class="w-full box-border p-3 text-sm bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-blue-500" placeholder="0">
          </div>
        </div>

        <!-- 股票專用輸入區塊 (多筆庫存整併) -->
        <div id="stock-asset-fields" class="space-y-3 hidden flex-col mt-4 border-t border-gray-100 pt-3">
          <div class="flex-1 flex flex-col min-h-0">
            <div class="flex justify-between items-center mb-2">
              <label class="block text-xs font-medium text-gray-700">股票庫存明細 <span class="text-[10px] text-gray-400 font-normal">(可新增多檔股票)</span></label>
              <button onclick="window.addStockLot()" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 font-bold rounded-lg hover:bg-blue-100 transition-colors shadow-sm">+ 新增一筆</button>
            </div>
            <div id="stock-lots-container" class="space-y-2 overflow-y-auto no-scrollbar max-h-[30vh] p-1 border border-gray-100 rounded-xl bg-gray-50/50">
               <!-- JS 動態插入庫存紀錄 -->
            </div>
          </div>
        </div>

      </div>

      <div class="mt-6 flex space-x-3 shrink-0">
         <button id="asset-delete-btn" onclick="window.deleteAsset()" class="hidden px-4 py-3 bg-red-50 text-red-600 font-bold rounded-xl active:scale-95 transition-all"><i class="fas fa-trash"></i></button>
         <button onclick="window.saveAsset()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-[0.98]">
           儲存資產
         </button>
      </div>
    </div>
  </div>

  <!-- APP 容器框架 -->
  <div class="w-full max-w-[400px] h-full md:h-[800px] bg-gray-50 md:rounded-[3rem] md:shadow-2xl relative overflow-hidden flex flex-col md:border-[8px] border-gray-900">
    
    <!-- 頂部 Header -->
    <header class="bg-white px-4 pt-10 pb-3 shadow-sm z-10 flex justify-between items-center shrink-0 h-16">
      <div class="text-base font-bold text-gray-800 tracking-wide">極簡記帳</div>
      <div class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200 text-xs font-bold shadow-sm transition-all" id="firebase-status">
        <i class="fas fa-spinner fa-spin"></i><span>連線中...</span>
      </div>
    </header>

    <!-- 提示框 -->
    <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 z-50 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm flex items-center opacity-0 pointer-events-none transition-opacity duration-300">
      <i class="fas fa-check-circle text-green-400 mr-2"></i><span id="toast-msg">操作成功</span>
    </div>

    <!-- 主要視圖區塊 -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
      
      <!-- ================= [頁面一] 記帳 (Add) ================= -->
      <div id="view-add" class="p-3 flex-1 flex flex-col">
        <div class="flex bg-gray-200 p-1 rounded-xl mb-3 shrink-0">
          <button id="btn-type-expense" onclick="window.setTxType('expense')" class="flex-1 py-1.5 text-sm font-bold bg-white shadow-sm rounded-lg text-gray-800 transition-colors">支出</button>
          <button id="btn-type-income" onclick="window.setTxType('income')" class="flex-1 py-1.5 text-sm font-bold text-gray-500 rounded-lg transition-colors">收入</button>
          <button id="btn-type-transfer" onclick="window.setTxType('transfer')" class="flex-1 py-1.5 text-sm font-bold text-gray-500 rounded-lg transition-colors">移轉</button>
        </div>

        <div id="category-section" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-3 shrink-0">
          <label class="block text-xs font-medium text-gray-700 mb-2">選擇分類</label>
          <div id="category-container" class="grid grid-cols-4 gap-2"></div>
        </div>
        
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 space-y-4 flex-1 overflow-y-auto no-scrollbar">
          <div class="w-full">
            <label class="block text-xs font-medium text-gray-700 mb-1">日期</label>
            <input type="date" id="input-date" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block">
          </div>
          <div id="asset-single-section" class="w-full">
            <label class="block text-xs font-medium text-gray-700 mb-1">資產帳戶</label>
            <select id="input-asset" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
          </div>
          <div id="asset-transfer-section" class="w-full hidden space-y-3">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">移出資產 (扣除)</label>
              <select id="input-asset-from" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">轉入資產 (增加)</label>
              <select id="input-asset-to" class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block"></select>
            </div>
          </div>
          <div class="w-full">
            <label class="block text-xs font-medium text-gray-700 mb-1">金額</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500 text-sm font-medium">$</span>
              <input type="number" id="input-amount" inputmode="numeric" pattern="[0-9]*" placeholder="0" class="w-full box-border pl-7 pr-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block">
            </div>
          </div>
          <div class="w-full pb-2">
            <label class="block text-xs font-medium text-gray-700 mb-1">備註 (選填)</label>
            <input type="text" id="input-note" placeholder="例如：晚餐、跨行轉帳..." class="w-full box-border px-3 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-lg outline-none focus:border-blue-500 focus:bg-white transition-colors block">
          </div>
        </div>

        <button onclick="window.addRecord()" class="w-full mt-3 py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-xl shadow-md shadow-blue-200 transition-all active:scale-[0.98] shrink-0">
          儲存紀錄
        </button>
      </div>

      <!-- ================= [頁面二] 統計 (Stats) ================= -->
      <div id="view-stats" class="p-3 space-y-3 hidden" style="touch-action: pan-y;">
        <div class="flex space-x-2">
          <select id="filter-year" onchange="window.updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center"></select>
          <select id="filter-month" onchange="window.updateStatsView()" class="flex-1 p-2.5 text-sm font-bold bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 text-gray-700 shadow-sm transition-colors appearance-none text-center">
            <option value="all">全年</option>
            <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
            <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
            <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
          </select>
        </div>
        <div class="flex bg-gray-200 p-1 rounded-lg">
           <button id="stats-type-expense" onclick="window.setStatsType('expense')" class="flex-1 py-1 text-xs font-bold bg-white shadow-sm rounded text-gray-800 transition-colors">支出分析</button>
           <button id="stats-type-income" onclick="window.setStatsType('income')" class="flex-1 py-1 text-xs font-bold text-gray-500 rounded transition-colors">收入分析</button>
        </div>
        <div class="flex space-x-2">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="input-search" placeholder="搜尋備註與分類..." oninput="window.handleSearch()" class="w-full pl-9 p-2.5 text-sm font-medium bg-white border border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors shadow-sm">
          </div>
          <button id="btn-clear-filter" onclick="window.clearCategoryFilter()" class="hidden px-3 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold hover:bg-gray-200 transition-colors shadow-sm whitespace-nowrap active:scale-95">清除篩選</button>
        </div>
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-4 text-white shadow-md relative overflow-hidden">
          <h3 id="stats-title-text" class="text-blue-100 text-xs font-medium mb-1 transition-all duration-300 transform origin-left">本月總額</h3>
          <div id="total-expense" class="text-3xl font-bold tracking-tight">$0</div>
        </div>
        <div id="stats-card" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
          <h3 class="w-full text-left text-sm font-bold text-gray-800 mb-2">結構佔比 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊圖表可篩選)</span></h3>
          <div class="relative flex items-center justify-center h-32 w-32">
            <canvas id="pieChart" width="128" height="128" class="cursor-pointer transition-transform hover:scale-105"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"><span class="text-gray-400 text-[10px]">Total</span></div>
          </div>
          <div id="stats-breakdown" class="w-full mt-4 space-y-1"></div>
        </div>
        <div>
          <h3 id="history-list-title" class="text-sm font-bold text-gray-800 mb-2 px-1">區間紀錄 <span class="text-[10px] text-gray-400 font-normal ml-1">(點擊文字可修改)</span></h3>
          <div id="history-list" class="space-y-2 pb-4"></div>
        </div>
      </div>

      <!-- ================= [頁面三] 資產 (Assets) ================= -->
      <div id="view-assets" class="p-3 space-y-4 hidden h-full overflow-y-auto no-scrollbar">
         <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 text-white shadow-md relative mt-1">
            <div class="flex justify-between items-start mb-2">
              <div class="flex items-center space-x-2">
                <h3 class="text-blue-100 text-sm font-medium">總淨資產</h3>
                <!-- 手動更新股價按鈕 -->
                <button onclick="window.fetchStockData(true)" class="text-blue-200 hover:text-white transition-colors" title="更新股價">
                  <i class="fas fa-sync-alt text-xs"></i>
                </button>
              </div>
              <button onclick="window.openAssetModal()" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-bold transition-colors shadow-sm active:scale-95">
                <i class="fas fa-plus mr-1"></i> 新增資產
              </button>
            </div>
            <div id="total-net-worth" class="text-4xl font-bold tracking-tight">$0</div>
         </div>
         <div id="assets-list" class="space-y-3 pb-6"></div>
      </div>

      <!-- ================= [頁面四] 設定 (Settings) ================= -->
      <div id="view-settings" class="p-3 space-y-3 hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-center">
            <div>
              <h2 class="text-lg font-bold text-gray-800">分類與發票關鍵字</h2>
              <p class="text-xs text-gray-500 mt-1">管理分類並設定發票自動歸類規則。</p>
            </div>
            <button onclick="window.openCategoryModal()" class="shrink-0 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold hover:bg-blue-100 transition-colors shadow-sm"><i class="fas fa-plus"></i> 新增</button>
          </div>
          <div class="p-4"><div id="settings-category-list" class="space-y-2 max-h-60 overflow-y-auto no-scrollbar"></div></div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50">
            <h2 class="text-lg font-bold text-gray-800">雲端發票整合</h2>
            <p class="text-xs text-gray-500 mt-1">請至財政部電子發票平台下載「發票明細表(CSV)」並在此匯入，系統會自動歸類與過濾重複資料。</p>
          </div>
          <div class="p-4">
            <div class="relative">
              <input type="file" id="import-invoice-file" accept=".csv" onchange="window.importInvoiceCSV(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <button class="w-full flex items-center justify-center py-2.5 bg-orange-50 text-orange-600 rounded-lg text-sm font-bold shadow-sm pointer-events-none transition-all hover:bg-orange-100"><i class="fas fa-file-invoice mr-2"></i> 匯入財政部發票 CSV</button>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-4">
          <div class="p-4 border-b border-gray-50 flex justify-between items-start">
            <div>
              <h2 class="text-lg font-bold text-gray-800">資料備份與還原</h2>
              <p class="text-xs text-gray-500 mt-1">您的資料已由 Firebase 即時同步保護。您也可額外匯出備份。</p>
            </div>
          </div>
          <div class="p-4 space-y-3">
            <button onclick="window.executeDriveUpload(false)" class="w-full flex items-center justify-center py-2.5 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fab fa-google-drive mr-2"></i> 額外備份至 Google Drive</button>
            <button onclick="window.syncFromDriveManual()" class="w-full flex items-center justify-center py-2.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold shadow-sm active:scale-95 transition-all"><i class="fas fa-sync mr-2"></i> 從 Drive 下載合併</button>
            <button onclick="window.exportData()" class="w-full flex items-center justify-center py-2.5 bg-gray-50 border border-gray-200 text-gray-600 rounded-lg text-sm font-medium"><i class="fas fa-download mr-2"></i> 下載備份檔 (JSON)</button>
            <div class="relative">
              <input type="file" id="import-file" accept=".json" onchange="window.importData(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
              <button class="w-full flex items-center justify-center py-2.5 bg-gray-50 text-gray-600 rounded-lg text-sm font-medium border border-gray-200 pointer-events-none transition-all"><i class="fas fa-upload mr-2"></i> 從 JSON 檔案還原</button>
            </div>
          </div>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm border border-red-100 overflow-hidden mt-4">
           <div class="p-4 space-y-3">
             <button onclick="window.handleLogout()" class="w-full flex items-center justify-center py-2.5 bg-orange-50 text-orange-600 rounded-lg text-sm font-medium">
                <i class="fas fa-sign-out-alt mr-2"></i> 登出帳號
             </button>
             <button onclick="window.clearAllData()" class="w-full flex items-center justify-center py-2.5 bg-red-50 text-red-600 rounded-lg text-sm font-medium">
                <i class="fas fa-trash-alt mr-2"></i> 清空所有資料
              </button>
           </div>
        </div>
      </div>

    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-gray-100 px-2 pt-2 pb-6 md:pb-2 flex justify-around items-center z-10 w-full shrink-0">
      <button onclick="window.switchTab('stats')" id="nav-stats" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-chart-pie text-xl"></i><span class="text-[10px] font-medium">統計</span></button>
      <button onclick="window.switchTab('add')" id="nav-add" class="flex-1 flex flex-col items-center space-y-1 text-blue-600 transition-colors"><i class="fas fa-plus-circle text-2xl"></i><span class="text-[10px] font-medium">記帳</span></button>
      <button onclick="window.switchTab('assets')" id="nav-assets" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-wallet text-xl"></i><span class="text-[10px] font-medium">資產</span></button>
      <button onclick="window.switchTab('settings')" id="nav-settings" class="flex-1 flex flex-col items-center space-y-1 text-gray-400 transition-colors"><i class="fas fa-cog text-xl"></i><span class="text-[10px] font-medium">設定</span></button>
    </nav>
  </div>

  <!-- JavaScript 邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // ==========================================
    // ⚙️ Firebase 與全域變數初始化
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDl3IYAAQGCwKLaSVGdY4ewZZlhVmu7dUg",
      authDomain: "book-dad94.firebaseapp.com",
      projectId: "book-dad94",
      storageBucket: "book-dad94.firebasestorage.app",
      messagingSenderId: "9435949525",
      appId: "1:9435949525:web:979b0a1afea30e40fcb55c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null, unsubscribeFirestore = null, unsubscribeCatFirestore = null, unsubscribeAssetFirestore = null, isSigningIn = false;
    const GOOGLE_CLIENT_ID = '939340478771-4bupp9mrpr55j1j4domrb4g6pehm86j5.apps.googleusercontent.com'; 
    let tokenClient;

    const ASSET_TYPES = {
      cash: { name: '現金', icon: 'fas fa-wallet', color: '#10B981', sign: 1 },
      deposit: { name: '存款', icon: 'fas fa-piggy-bank', color: '#3B82F6', sign: 1 },
      investment: { name: '投資', icon: 'fas fa-chart-line', color: '#8B5CF6', sign: 1 },
      stock: { name: '股票庫存', icon: 'fas fa-chart-bar', color: '#F59E0B', sign: 1 },
      credit: { name: '信用貸款', icon: 'fas fa-credit-card', color: '#EF4444', sign: -1 },
      mortgage: { name: '房屋貸款', icon: 'fas fa-house-damage', color: '#EC4899', sign: -1 }
    };

    const DEFAULT_CATEGORIES = [
      { id: 'food', name: '餐飲', icon: 'fas fa-utensils', color: '#F59E0B', type: 'expense', keywords: [] },
      { id: 'clothes', name: '服飾', icon: 'fas fa-tshirt', color: '#EC4899', type: 'expense', keywords: [] },
      { id: 'housing', name: '居住', icon: '居住', icon: 'fas fa-home', color: '#8B5CF6', type: 'expense', keywords: [] },
      { id: 'transport', name: '交通', icon: 'fas fa-car', color: '#3B82F6', type: 'expense', keywords: [] },
      { id: 'education', name: '學習', icon: 'fas fa-book', color: '#10B981', type: 'expense', keywords: [] },
      { id: 'entertainment', name: '娛樂', icon: 'fas fa-gamepad', color: '#EF4444', type: 'expense', keywords: [] },
      { id: 'other', name: '其他', icon: 'fas fa-ellipsis-h', color: '#6B7280', type: 'expense', keywords: [] },
      { id: 'salary', name: '薪資', icon: 'fas fa-hand-holding-usd', color: '#10B981', type: 'income', keywords: ['薪水', '獎金'] },
      { id: 'income_other', name: '其他收入', icon: 'fas fa-coins', color: '#F59E0B', type: 'income', keywords: [] }
    ];

    let categories = [], records = [], assets = [];
    let selectedCategoryId = null, currentTab = 'add', currentTxType = 'expense', currentStatsType = 'expense';
    let currentSearchQuery = '', currentCategoryFilter = null, pieChartSlices = [];

    // --- 股票即時行情快取區 ---
    let twseData = null;
    let isFetchingStock = false;

    // ==========================================
    // 📈 獲取台股上市/上櫃開源 API (搭配多重 CORS Proxy 備援)
    // ==========================================
    window.fetchStockData = async (force = false) => {
        if ((twseData && !force) || isFetchingStock) return;
        isFetchingStock = true;
        if(force) window.showToast('更新股市行情中...');
        try {
            if(!twseData) twseData = {};
            
            // 建立多個 Proxy 作為備援，避免單一 Proxy 被證交所阻擋 (522 錯誤)
            const proxies = [
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest=',
                'https://api.allorigins.win/raw?url='
            ];

            const fetchWithFallback = async (targetUrl) => {
                for (let proxy of proxies) {
                    try {
                        const res = await fetch(proxy + encodeURIComponent(targetUrl));
                        if (res.ok) return await res.json();
                    } catch (e) {
                        console.warn(`Proxy ${proxy} failed.`);
                    }
                }
                throw new Error('All proxies failed');
            };

            const dataTwse = await fetchWithFallback('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
            if (dataTwse && Array.isArray(dataTwse)) {
                dataTwse.forEach(item => { 
                    let priceStr = String(item.ClosingPrice).replace(/,/g, '');
                    twseData[item.Code] = { name: item.Name, price: parseFloat(priceStr) || 0 }; 
                });
            }

            const dataTpex = await fetchWithFallback('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes');
            if (dataTpex && Array.isArray(dataTpex)) {
                dataTpex.forEach(item => { 
                    let priceStr = String(item.Close).replace(/,/g, '');
                    twseData[item.SecuritiesCompanyCode] = { name: item.CompanyName, price: parseFloat(priceStr) || 0 }; 
                });
            }

            if(force) {
                window.showToast('✅ 股市行情更新成功');
                window.renderAssetsView(); 
                window.renderAssetSelects(); 
            }
        } catch (e) {
            console.error('Fetch Stock API Error:', e);
            if(force) window.showToast('❌ 股市更新失敗，請稍後再試');
        }
        isFetchingStock = false;
    };

    // ==========================================
    // 🛠️ 資料強固與清洗機制
    // ==========================================
    window.sanitizeRecords = (arr) => {
        if (!Array.isArray(arr)) return [];
        return arr.map(r => {
            let derivedType = r.type;
            if (r.cat && r.cat !== 'transfer') {
                const catObj = categories.find(c => c.id === r.cat);
                if (catObj && catObj.type) {
                    derivedType = catObj.type;
                }
            } else if (r.cat === 'transfer') {
                derivedType = 'transfer';
            }

            return {
                ...r,
                id: String(r.id || Date.now()), 
                date: String(r.date || new Date().toISOString().split('T')[0]), 
                amount: Number(r.amount) || 0, 
                note: String(r.note || ''),
                type: derivedType || (r.cat === 'transfer' ? 'transfer' : 'expense'),
                assetId: r.assetId || (r.type !== 'transfer' ? (assets[0]?.id || 'asset_cash') : undefined)
            };
        }).sort((a, b) => new Date(b.date) - new Date(a.date));
    };

    try { const sc = localStorage.getItem('my_categories'); categories = sc ? JSON.parse(sc) : [...DEFAULT_CATEGORIES]; } catch(e){ categories = [...DEFAULT_CATEGORIES]; } 
    categories.forEach(c => { if(!c.type) c.type = 'expense'; }); if(!categories.some(c => c.type === 'income')) categories.push(...DEFAULT_CATEGORIES.filter(c => c.type === 'income'));
    
    try { const sa = localStorage.getItem('my_assets'); assets = sa ? JSON.parse(sa) : [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; } catch(e){ assets = [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; } 
    if(!Array.isArray(assets) || assets.length === 0) assets.push({ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 });
    
    try { const sr = localStorage.getItem('my_expenses'); records = sr ? JSON.parse(sr) : []; } catch(e){ records = []; } 
    records = window.sanitizeRecords(records); 

    // ==========================================
    // 🔒 認證與登入邏輯 (Firebase)
    // ==========================================
    window.signInWithGoogle = async () => {
       if (isSigningIn) return; isSigningIn = true;
       const errorEl = document.getElementById('auth-error'), btnEl = document.getElementById('auth-submit-btn'), btnText = document.getElementById('auth-btn-text');
       if (errorEl) errorEl.classList.add('opacity-0');
       if (btnEl) btnEl.classList.add('opacity-50', 'pointer-events-none'); 
       if (btnText) btnText.innerText = '登入中...';
       try {
           googleProvider.setCustomParameters({ prompt: 'select_account' });
           const result = await signInWithPopup(auth, googleProvider);
           if (result && result.user) {
               document.getElementById('auth-screen').classList.add('opacity-0', 'pointer-events-none');
               setTimeout(() => { document.getElementById('auth-screen').style.display = 'none'; }, 300);
           }
       } catch (error) {
           if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
               if (errorEl) { errorEl.innerText = `發生錯誤 (${error.code})。`; errorEl.classList.remove('opacity-0'); }
           }
       } finally {
           isSigningIn = false;
           if (btnEl) btnEl.classList.remove('opacity-50', 'pointer-events-none');
           if (btnText) btnText.innerText = '使用 Google 帳號登入';
       }
    };

    window.handleLogout = async () => { await signOut(auth); window.showToast('已登出帳號'); };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const statusEl = document.getElementById('firebase-status'), authScreen = document.getElementById('auth-screen');
      if (user) {
        if(statusEl) {
            statusEl.innerHTML = '<i class="fas fa-wifi"></i><span>已連線</span>';
            statusEl.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-green-50 text-green-600 border border-green-200 text-xs font-bold shadow-sm transition-all";
        }
        if(authScreen) {
            authScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { authScreen.style.display = 'none'; }, 300);
        }
        setupFirestoreListener();
      } else {
        if(statusEl) {
            statusEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>離線</span>';
            statusEl.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-red-50 text-red-600 border border-red-200 text-xs font-bold shadow-sm transition-all";
        }
        if(authScreen) {
            authScreen.style.display = 'flex'; void authScreen.offsetWidth; authScreen.classList.remove('opacity-0', 'pointer-events-none');
        }
        if (unsubscribeFirestore) unsubscribeFirestore(); 
        if (unsubscribeCatFirestore) unsubscribeCatFirestore();
        if (unsubscribeAssetFirestore) unsubscribeAssetFirestore();
      }
    });

    function setupFirestoreListener() {
      if (!currentUser) return;
      unsubscribeFirestore = onSnapshot(doc(db, 'users', currentUser.uid, 'sync', 'expenses'), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list) {
            records = window.sanitizeRecords(docSnap.data().list); 
            localStorage.setItem('my_expenses', JSON.stringify(records));
            window.initDateFilters(); if (currentTab === 'stats') window.updateStatsView();
        } else { window.syncExpensesToCloud(); }
      });
      unsubscribeCatFirestore = onSnapshot(doc(db, 'users', currentUser.uid, 'settings', 'categories'), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list && Array.isArray(docSnap.data().list) && docSnap.data().list.length > 0) {
            categories = docSnap.data().list; localStorage.setItem('my_categories', JSON.stringify(categories));
            window.renderCategories(); window.renderSettingsCategories(); if (currentTab === 'stats') window.updateStatsView();
        } else { window.syncCategoriesToCloud(); }
      });
      unsubscribeAssetFirestore = onSnapshot(doc(db, 'users', currentUser.uid, 'sync', 'assets'), (docSnap) => {
        if (docSnap.exists() && docSnap.data().list && Array.isArray(docSnap.data().list) && docSnap.data().list.length > 0) {
            assets = docSnap.data().list; localStorage.setItem('my_assets', JSON.stringify(assets));
            window.renderAssetSelects(); if (currentTab === 'assets') window.renderAssetsView();
        } else { window.syncAssetsToCloud(); }
      });
    }

    window.syncCategoriesToCloud = async () => { if (currentUser) try { await setDoc(doc(db, 'users', currentUser.uid, 'settings', 'categories'), { list: categories }); } catch(e){} };
    window.syncExpensesToCloud = async () => { if (currentUser) try { await setDoc(doc(db, 'users', currentUser.uid, 'sync', 'expenses'), { list: records }); } catch(e){} };
    window.syncAssetsToCloud = async () => { if (currentUser) try { await setDoc(doc(db, 'users', currentUser.uid, 'sync', 'assets'), { list: assets }); } catch(e){} };

    // ==========================================
    // 💼 核心視圖邏輯
    // ==========================================
    window.showToast = (msg) => { const toast = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; toast.classList.remove('opacity-0'); setTimeout(() => toast.classList.add('opacity-0'), 2000); };
    
    window.switchTab = (tab) => {
      currentTab = tab;
      ['add', 'stats', 'assets', 'settings'].forEach(t => document.getElementById(`view-${t}`).classList.add('hidden'));
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.querySelectorAll('nav button').forEach(b => { b.classList.remove('text-blue-600'); b.classList.add('text-gray-400'); });
      document.getElementById(`nav-${tab}`).classList.replace('text-gray-400', 'text-blue-600');
      if(tab === 'stats') window.updateStatsView();
      if(tab === 'assets') window.renderAssetsView();
      if(tab === 'settings') window.renderSettingsCategories();
    };

    window.setTxType = (type) => {
      currentTxType = type;
      ['expense', 'income', 'transfer'].forEach(t => {
         const btn = document.getElementById(`btn-type-${t}`);
         btn.className = (t === type) ? 'flex-1 py-1.5 text-sm font-bold bg-white shadow-sm rounded-lg text-gray-800 transition-colors' : 'flex-1 py-1.5 text-sm font-bold text-gray-500 rounded-lg transition-colors';
      });
      if (type === 'transfer') {
         document.getElementById('category-section').classList.add('hidden'); 
         document.getElementById('asset-single-section').classList.add('hidden'); 
         document.getElementById('asset-transfer-section').classList.remove('hidden');
      } else {
         document.getElementById('category-section').classList.remove('hidden'); 
         document.getElementById('asset-single-section').classList.remove('hidden'); 
         document.getElementById('asset-transfer-section').classList.add('hidden');
         window.renderCategories(); 
      }
    };

    window.renderAssetSelects = () => {
        const options = assets.map(a => {
            let displayBalance = a.balance;
            let displayName = a.name;
            if (a.type === 'stock') {
                if (twseData) {
                    let totalMv = 0;
                    (a.lots || []).forEach(l => {
                        const price = twseData[l.stockId] ? twseData[l.stockId].price : 0;
                        totalMv += price > 0 ? price * l.shares : l.cost;
                    });
                    if (a.lots && a.lots.length > 0) displayBalance = totalMv;
                }
            }
            return `<option value="${a.id}">${displayName} ($${Math.round(displayBalance).toLocaleString()})</option>`;
        }).join('');
        const inA = document.getElementById('input-asset'); if(inA) inA.innerHTML = options;
        const inF = document.getElementById('input-asset-from'); if(inF) inF.innerHTML = options;
        const inT = document.getElementById('input-asset-to'); if(inT) inT.innerHTML = options;
    };

    window.renderAssetsView = async () => {
       const hasStocks = assets.some(a => a.type === 'stock');
       if (hasStocks && !twseData) {
           document.getElementById('assets-list').innerHTML = `
             <div class="text-center py-10 flex flex-col items-center">
               <i class="fas fa-spinner fa-spin text-gray-400 text-2xl mb-3"></i>
               <p class="text-xs text-gray-500">正在取得最新股市行情...</p>
             </div>`;
           await window.fetchStockData();
       }

       let netWorth = 0;
       const list = document.getElementById('assets-list');
       if(assets.length === 0) { 
           list.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">尚無資產項目</div>'; 
           document.getElementById('total-net-worth').innerText = `$0`;
           return; 
       }
       
       list.innerHTML = assets.map(a => {
           const typeInfo = ASSET_TYPES[a.type] || ASSET_TYPES['cash'];
           let balanceToUse = a.balance;
           let extraInfoHtml = '';

           if (a.type === 'stock') {
               let totalMarketValue = 0;
               let totalCost = 0;
               let groups = {};

               // 相容舊資料邏輯
               const lots = a.lots || [];
               if (lots.length === 0 && a.stockId) {
                   lots.push({ stockId: a.stockId, shares: a.shares || 0, cost: a.cost || 0 });
               }

               // 將相同代號的股票彙整 (總股數與總成本)
               lots.forEach(l => {
                   if (!l.stockId) return;
                   if (!groups[l.stockId]) groups[l.stockId] = { shares: 0, cost: 0 };
                   groups[l.stockId].shares += Number(l.shares);
                   groups[l.stockId].cost += Number(l.cost);
               });

               let stocksHtml = Object.keys(groups).map(sid => {
                   const g = groups[sid];
                   const stockInfo = twseData && twseData[sid];
                   const currentPrice = stockInfo ? stockInfo.price : 0;
                   const stockName = stockInfo ? stockInfo.name : '未上市/無資料';
                   const marketValue = currentPrice > 0 ? currentPrice * g.shares : g.cost;
                   
                   totalMarketValue += marketValue;
                   totalCost += g.cost;

                   const pl = marketValue - g.cost;
                   const plRate = g.cost > 0 ? ((pl / g.cost) * 100).toFixed(2) : 0;
                   const plColor = pl > 0 ? 'text-red-500' : (pl < 0 ? 'text-green-500' : 'text-gray-500');
                   const plSign = pl > 0 ? '+' : '';
                   const avgCost = g.shares > 0 ? (g.cost / g.shares).toFixed(2) : '0.00';
                   const displayPrice = currentPrice > 0 ? currentPrice : '--';

                   return `
                     <div class="flex flex-col text-[11px] bg-gray-50/80 rounded-lg p-2.5">
                       <div class="flex justify-between font-bold text-gray-700 mb-1">
                         <span class="text-xs">${sid} ${stockName}</span>
                         <span>${g.shares.toLocaleString()} 股</span>
                       </div>
                       <div class="flex justify-between text-gray-500 mb-0.5">
                         <span>均價 $${avgCost} | 昨收 $${displayPrice}</span>
                         <span>成本 $${Math.round(g.cost).toLocaleString()}</span>
                       </div>
                       <div class="flex justify-between items-center mt-1 pt-1 border-t border-gray-200/50">
                         <span class="text-gray-500">市值 $${Math.round(marketValue).toLocaleString()}</span>
                         <span class="font-bold ${plColor}">${plSign}$${Math.round(pl).toLocaleString()} (${plSign}${plRate}%)</span>
                       </div>
                     </div>
                   `;
               }).join('');

               // 如果這個證券戶完全沒有任何庫存
               if (Object.keys(groups).length === 0) {
                   stocksHtml = `<div class="text-center text-gray-400 text-xs py-2">目前尚無庫存股票</div>`;
               }

               balanceToUse = totalMarketValue;
               const totalPl = totalMarketValue - totalCost;
               const totalPlColor = totalPl > 0 ? 'text-red-500' : (totalPl < 0 ? 'text-green-500' : 'text-gray-500');
               const totalPlSign = totalPl > 0 ? '+' : '';

               extraInfoHtml = `
                 <div class="mt-3 pt-3 border-t border-gray-100 flex flex-col w-full space-y-2">
                    ${stocksHtml}
                    <div class="flex justify-between items-center text-xs font-bold pt-1 px-1">
                        <span class="text-gray-600">總成本: $${Math.round(totalCost).toLocaleString()}</span>
                        <span class="${totalPlColor}">總損益: ${totalPlSign}$${Math.round(totalPl).toLocaleString()}</span>
                    </div>
                 </div>
               `;
           }

           netWorth += balanceToUse * typeInfo.sign;

           return `
             <div onclick="window.openAssetModal('${a.id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col cursor-pointer hover:border-blue-200 transition-colors">
                <div class="flex items-center justify-between w-full">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background-color: ${typeInfo.color}"><i class="${typeInfo.icon} text-lg"></i></div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">${a.name}</div>
                            <div class="text-[10px] text-gray-400">${typeInfo.name}</div>
                        </div>
                    </div>
                    <div class="text-right font-bold text-lg text-gray-800">$${Math.round(balanceToUse).toLocaleString()}</div>
                </div>
                ${extraInfoHtml}
             </div>
           `;
       }).join('');
       
       document.getElementById('total-net-worth').innerText = `$${Math.round(netWorth).toLocaleString()}`;
    };

    window.renderCategories = () => {
        const container = document.getElementById('category-container'); if(!container) return;
        const filteredCats = categories.filter(c => c.type === currentTxType);
        container.innerHTML = filteredCats.map(cat => `<button onclick="window.selectCategory('${cat.id}')" class="cat-btn flex flex-col items-center p-2 rounded-xl transition-all border-2 bg-gray-50 border-transparent" data-id="${cat.id}"><div class="icon-wrap w-8 h-8 flex items-center justify-center rounded-full mb-1 transition-colors" style="background-color: #E5E7EB; color: #6B7280"><i class="${cat.icon} text-sm"></i></div><span class="text-[10px] transition-colors text-gray-600 whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">${cat.name}</span></button>`).join('');
        if(!filteredCats.find(c => c.id === selectedCategoryId)) selectedCategoryId = filteredCats[0]?.id;
        if(selectedCategoryId) window.selectCategory(selectedCategoryId);
    };

    window.selectCategory = (id) => {
      selectedCategoryId = id;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const cat = categories.find(c => c.id === btn.dataset.id); if(!cat) return;

        if (!Array.from(yearSelect.options).some(opt => opt.value === y.toString())) { yearSelect.innerHTML += `<option value="${y}">${y}年</option>`; }

    };

    window.deleteAsset = () => {
        const id = document.getElementById('asset-id-input').value; if(!id) return;
        if(records.some(r => r.assetId === id || r.assetFrom === id || r.assetTo === id)) { if(!confirm('此資產已有相關記帳紀錄，刪除後歷史紀錄將遺失對應帳戶，確定強制刪除？')) return; } else if(!confirm('確定要刪除此資產嗎？')) return;
        assets = assets.filter(x => x.id !== id); localStorage.setItem('my_assets', JSON.stringify(assets)); window.renderAssetsView(); window.renderAssetSelects(); window.closeAssetModal(); window.showToast('已刪除資產'); window.syncAssetsToCloud();
    };

    window.openCategoryModal = (catId = null) => {
        const modal = document.getElementById('category-modal'), inner = modal.querySelector('div');
        modal.classList.remove('opacity-0', 'pointer-events-none'); inner.classList.remove('translate-y-full'); inner.classList.add('translate-y-0');
        if (catId) {
            const cat = categories.find(c => c.id === catId); document.getElementById('cat-modal-title').innerText = '編輯分類'; document.getElementById('cat-id-input').value = cat.id; document.getElementById('cat-type-input').value = cat.type; document.getElementById('cat-name-input').value = cat.name; document.getElementById('cat-keywords-input').value = (cat.keywords||[]).join(', '); selectedIconForCat = cat.icon; selectedColorForCat = cat.color; document.getElementById('cat-delete-btn').classList.toggle('hidden', cat.id === 'other');
        } else {
            document.getElementById('cat-modal-title').innerText = '新增分類'; document.getElementById('cat-id-input').value = ''; document.getElementById('cat-type-input').value = 'expense'; document.getElementById('cat-name-input').value = ''; document.getElementById('cat-keywords-input').value = ''; selectedIconForCat = 'fas fa-utensils'; selectedColorForCat = '#F59E0B'; document.getElementById('cat-delete-btn').classList.add('hidden');
        }
        window.renderCatModalPickers();
    };
    window.closeCategoryModal = () => { const modal = document.getElementById('category-modal'); modal.querySelector('div').classList.add('translate-y-full'); setTimeout(() => { modal.classList.add('opacity-0', 'pointer-events-none'); }, 300); };
    
    const AVAILABLE_ICONS = ['fas fa-utensils', 'fas fa-tshirt', 'fas fa-home', 'fas fa-car', 'fas fa-book', 'fas fa-gamepad', 'fas fa-shopping-cart', 'fas fa-heart', 'fas fa-gift', 'fas fa-plane', 'fas fa-pills', 'fas fa-paw', 'fas fa-baby', 'fas fa-music', 'fas fa-laptop', 'fas fa-coffee', 'fas fa-camera', 'fas fa-dumbbell', 'fas fa-ellipsis-h', 'fas fa-hand-holding-usd', 'fas fa-coins'];
    const AVAILABLE_COLORS = ['#F59E0B', '#EC4899', '#8B5CF6', '#3B82F6', '#10B981', '#EF4444', '#6B7280', '#14B8A6', '#F43F5E', '#84CC16', '#FF8C00', '#2E8B57'];
    let selectedIconForCat = AVAILABLE_ICONS[0], selectedColorForCat = AVAILABLE_COLORS[0];

    window.renderCatModalPickers = () => { document.getElementById('cat-icon-picker').innerHTML = AVAILABLE_ICONS.map(i => `<button onclick="window.selectModalIcon('${i}')" class="w-10 h-10 rounded-full border-2 ${selectedIconForCat===i ? 'border-blue-500 bg-blue-50 text-blue-600' : 'border-transparent bg-gray-100 text-gray-500'}"><i class="${i}"></i></button>`).join(''); document.getElementById('cat-color-picker').innerHTML = AVAILABLE_COLORS.map(c => `<button onclick="window.selectModalColor('${c}')" class="w-8 h-8 rounded-full border-2 ${selectedColorForCat===c ? 'border-gray-800 scale-110' : 'border-transparent'}" style="background-color: ${c}">${selectedColorForCat===c ? '<i class="fas fa-check text-white text-xs"></i>' : ''}</button>`).join(''); };
    window.selectModalIcon = (icon) => { selectedIconForCat = icon; window.renderCatModalPickers(); }; window.selectModalColor = (color) => { selectedColorForCat = color; window.renderCatModalPickers(); };
    window.saveCategory = () => {
        const idInput = document.getElementById('cat-id-input').value, name = document.getElementById('cat-name-input').value.trim(), type = document.getElementById('cat-type-input').value; if(!name) return window.showToast('請輸入名稱'); const keywords = document.getElementById('cat-keywords-input').value.split(',').map(k=>k.trim()).filter(k=>k);
        if (idInput) { const idx = categories.findIndex(c => c.id === idInput); if(idx!==-1) categories[idx] = { ...categories[idx], name, type, icon: selectedIconForCat, color: selectedColorForCat, keywords }; } else categories.push({ id: 'cat_' + Date.now(), name, type, icon: selectedIconForCat, color: selectedColorForCat, keywords });
        localStorage.setItem('my_categories', JSON.stringify(categories)); window.renderCategories(); window.renderSettingsCategories(); if(currentTab === 'stats') window.updateStatsView(); window.closeCategoryModal(); window.showToast('✅ 儲存成功'); window.syncCategoriesToCloud();
    };
    window.deleteCurrentCategory = () => {
        const idInput = document.getElementById('cat-id-input').value; if(!idInput || idInput === 'other' || !confirm('確定刪除？')) return;
        categories = categories.filter(c => c.id !== idInput); let changed = false; records.forEach(r => { if(r.cat === idInput) { r.cat = 'other'; changed = true; } });
        localStorage.setItem('my_categories', JSON.stringify(categories)); if (changed) { localStorage.setItem('my_expenses', JSON.stringify(records)); window.syncExpensesToCloud(); }
        window.renderCategories(); window.renderSettingsCategories(); if(currentTab === 'stats') window.updateStatsView(); window.closeCategoryModal(); window.showToast('✅ 已刪除'); window.syncCategoriesToCloud();
    };
    window.renderSettingsCategories = () => { document.getElementById('settings-category-list').innerHTML = categories.map(cat => `<div onclick="window.openCategoryModal('${cat.id}')" class="flex items-center justify-between p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 border border-transparent hover:border-blue-200"><div class="flex items-center space-x-3"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0" style="background-color: ${cat.color}"><i class="${cat.icon} text-sm"></i></div><div class="overflow-hidden"><div class="text-sm font-bold text-gray-800">${cat.name} <span class="ml-1 text-[10px] px-1.5 py-0.5 rounded ${cat.type==='income'?'bg-green-100 text-green-600':'bg-red-100 text-red-600'}">${cat.type==='income'?'收入':'支出'}</span></div><div class="text-[10px] text-gray-500 w-48 truncate">${(cat.keywords||[]).join(', ') || '無關鍵字'}</div></div></div><i class="fas fa-edit text-gray-400 text-xs shrink-0"></i></div>`).join(''); };

    // ==========================================
    // ☁️ 發票與進階備份邏輯
    // ==========================================
    window.autoCategorize = (shopName) => { const name = shopName.toLowerCase(); for (const cat of categories) { if (cat.keywords?.some(kw => name.includes(kw.toLowerCase()))) return cat.id; } return 'other'; };
    window.parseCSVLine = (line) => { const res = []; let cur = '', inQ = false; for(let i=0;i<line.length;i++){ const c = line[i]; if(inQ){ if(c==='"' && line[i+1]==='"'){ cur+='"'; i++; } else if(c==='"') inQ = false; else cur+=c; } else { if(c==='"') inQ=true; else if(c===','){ res.push(cur); cur=''; } else cur+=c; } } res.push(cur); return res.map(v=>v.trim()); };
    window.importInvoiceCSV = (event) => {
      const file = event.target.files[0]; if(!file) return; const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const lines = e.target.result.split(/\r?\n/).filter(l => l.trim()), invoiceMap = new Map(); let newC = 0, skipC = 0;
          for(let i=1;i<lines.length;i++) {
             const cols = window.parseCSVLine(lines[i]); if(cols.length < 8) continue;
             const invNum = cols[2], amt = parseInt(cols[3]); if(!invNum?.match(/^[A-Z0-9]{2}\d{8}$/) || isNaN(amt)) continue;
             if(!invoiceMap.has(invNum)) invoiceMap.set(invNum, { dateRaw: cols[1], amount: amt, shopName: cols[7], items: cols[13]?[cols[13]]:[] });
             else { const d = invoiceMap.get(invNum); if(cols[13] && !d.items.includes(cols[13])) d.items.push(cols[13]); if(amt > d.amount) d.amount = amt; }
          }
          invoiceMap.forEach((d, invNum) => {
              const formattedDate = d.dateRaw.includes('/') ? d.dateRaw.replace(/\//g, '-') : (d.dateRaw.length===8 ? `${d.dateRaw.substring(0,4)}-${d.dateRaw.substring(4,6)}-${d.dateRaw.substring(6,8)}` : new Date().toISOString().split('T')[0]);
              if(!records.some(r => String(r.id) === `INV_${invNum}`)) { 
                  const rec = { id: `INV_${invNum}`, type: 'expense', amount: d.amount, cat: window.autoCategorize(d.shopName), assetId: assets[0]?.id || 'asset_cash', date: formattedDate, note: `${d.shopName}${d.items.length ? ` (${d.items.slice(0,2).join('、')}${d.items.length>2?'...':''})` : ''}` };
                  records.push(rec); newC++; if(assets[0]) assets[0].balance -= d.amount;
              } else skipC++;
          });
          if(newC > 0) { records.sort((a,b)=>new Date(b.date)-new Date(a.date)); localStorage.setItem('my_expenses', JSON.stringify(records)); localStorage.setItem('my_assets', JSON.stringify(assets)); window.initDateFilters(); if(currentTab==='stats') window.updateStatsView(); window.showToast(`✅ 匯入 ${newC} 張新發票`); window.syncExpensesToCloud(); window.syncAssetsToCloud(); } else window.showToast(`⚠️ 無新發票`);
        } catch(err) { window.showToast('❌ 解析失敗'); } event.target.value = ''; 
      }; reader.readAsText(file, 'UTF-8'); 
    };

    window.exportData = () => { if(records.length===0 && assets.length===0) return window.showToast('無資料可匯出'); const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify({ version: 2, records, categories, assets })); a.download = `expense_backup_${new Date().toISOString().split('T')[0]}.json`; a.click(); window.showToast('✅ 備份下載成功'); };
    window.importData = (e) => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = (ev) => { try { const imp = JSON.parse(ev.target.result); if(Array.isArray(imp)) records = window.sanitizeRecords(imp); else { records = window.sanitizeRecords(imp.records||[]); if(imp.categories) categories = imp.categories; if(imp.assets) assets = imp.assets; } localStorage.setItem('my_expenses', JSON.stringify(records)); localStorage.setItem('my_categories', JSON.stringify(categories)); localStorage.setItem('my_assets', JSON.stringify(assets)); window.initDateFilters(); window.renderAssetSelects(); window.showToast('✅ 還原成功'); window.syncExpensesToCloud(); window.syncCategoriesToCloud(); window.syncAssetsToCloud(); } catch(err){ window.showToast('❌ 格式錯誤'); } e.target.value = ''; }; r.readAsText(f); };
    window.clearAllData = () => { if(confirm('警告：確定刪除所有資料？')) { records = []; assets = [{ id: 'asset_cash', name: '現金', type: 'cash', balance: 0 }]; localStorage.removeItem('my_expenses'); localStorage.setItem('my_assets', JSON.stringify(assets)); window.initDateFilters(); window.renderAssetSelects(); window.showToast('已清空'); window.syncExpensesToCloud(); window.syncAssetsToCloud(); } };

    // Google Drive 備份支援(作為輔助)
    window.initGoogleClient = () => { if(typeof google!=='undefined'&&google.accounts) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: async (t) => { if(t?.access_token) { localStorage.setItem('gdrive_token', t.access_token); window.showToast('✅ Drive 連線成功！'); } } }); };
    
    const checkGoogleClient = setInterval(() => { if (typeof google !== 'undefined' && google.accounts) { clearInterval(checkGoogleClient); window.initGoogleClient(); } }, 200);
    
    window.syncFromDriveManual = () => { if(tokenClient) tokenClient.requestAccessToken({ prompt: 'select_account' }); else window.showToast('Drive 未載入'); };
    window.executeDriveUpload = () => { if(tokenClient) tokenClient.requestAccessToken({ prompt: 'select_account' }); else window.showToast('Drive 未載入'); };

    // ==========================================
    // 🚀 初始化執行
    // ==========================================
    document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
    window.renderAssetSelects();
    window.setTxType('expense');
    window.initDateFilters(true);
    window.initCanvasClickListener();
    window.initSwipeGestures();
    
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
